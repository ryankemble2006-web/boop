name: Check BOOP appearance logic
on:
  push:
    branches: [boop-unified-eye-sync-safe-v159]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: boop-appearance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve the existing version-pinned JSON test dependency
        shell: bash
        run: |
          set -euo pipefail
          DEST="$HOME/.gradle/caches/modules-2/files-2.1/org.json/json/20240303/boop-check/json-20240303.jar"
          URL=https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar
          mkdir -p "$(dirname "$DEST")"
          curl --fail --silent --show-error --location --retry 2 "$URL" -o "$DEST"
          EXPECTED="$(curl --fail --silent --show-error --location --retry 2 "$URL.sha1" | tr -d '\r\n')"
          [[ "$EXPECTED" =~ ^[0-9a-fA-F]{40}$ ]]
          printf '%s  %s\n' "$EXPECTED" "$DEST" | sha1sum --check
          python -m pip install pytest
      - name: Test colour protocol, state and runtime contracts
        run: python -m pytest -q tests/test_shared_eye_colour.py
      - name: Preserve accepted Shield logic
        run: |
          python tests/test_deezer_artist.py
          python tests/test_favourites_picker.py
