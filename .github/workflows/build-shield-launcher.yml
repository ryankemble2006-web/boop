name: Build BOOP Shield Launcher
on:
  push:
    branches: [boop-shield-launcher-standalone]
    paths-ignore: ['**.md', 'docs/**', 'BOOP_MEMORY.txt']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: boop-shield-launcher-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Android build components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
          cache-read-only: false
      - name: Materialize launcher only
        run: python scripts/materialize-shield-launcher.py
      - name: Nonvisual behavior and dependency checks
        run: |
          python tests/test_shield_launcher_split.py
          python scripts/test-launcher-close.py
          python scripts/test-startup-manager.py
          python scripts/test-startup-defaults.py
      - name: Prepare existing permanent signer
        shell: bash
        env:
          BOOP_DEV_KEYSTORE_B64: ${{ secrets.BOOP_DEV_KEYSTORE_B64 }}
          BOOP_DEV_STORE_PASSWORD: ${{ secrets.BOOP_DEV_STORE_PASSWORD }}
          BOOP_DEV_KEY_PASSWORD: ${{ secrets.BOOP_DEV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in BOOP_DEV_KEYSTORE_B64 BOOP_DEV_STORE_PASSWORD BOOP_DEV_KEY_PASSWORD; do test -n "${!name:-}"; done
          printf '%s' "$BOOP_DEV_KEYSTORE_B64" | base64 --decode > "${RUNNER_TEMP}/boop-dev.jks"
          chmod 600 "${RUNNER_TEMP}/boop-dev.jks"
          keytool -list -keystore "${RUNNER_TEMP}/boop-dev.jks" -storepass "$BOOP_DEV_STORE_PASSWORD" -alias boop-dev >/dev/null
          echo "BOOP_SIGNING_STORE_FILE=${RUNNER_TEMP}/boop-dev.jks" >> "$GITHUB_ENV"
      - name: Build signed standalone APK
        env:
          BOOP_DEV_STORE_PASSWORD: ${{ secrets.BOOP_DEV_STORE_PASSWORD }}
          BOOP_DEV_KEY_PASSWORD: ${{ secrets.BOOP_DEV_KEY_PASSWORD }}
        run: gradle --no-daemon -p shield-launcher :app:assembleDebug
      - name: Verify standalone identity, dependencies and permanent signature
        shell: bash
        run: |
          set -euo pipefail
          APK=shield-launcher/app/build/outputs/apk/debug/app-debug.apk
          TOOLS="${ANDROID_HOME}/build-tools/36.0.0"
          mkdir -p release-launcher
          "$TOOLS/aapt" dump badging "$APK" > release-launcher/badging.txt
          grep -Fq "package: name='com.boop.shieldlauncher'" release-launcher/badging.txt
          grep -Fq "versionCode='1'" release-launcher/badging.txt
          grep -Fq "launchable-activity: name='com.boop.shieldhome.ShieldLauncherActivity'" release-launcher/badging.txt
          "$TOOLS/aapt" dump xmltree "$APK" AndroidManifest.xml > release-launcher/manifest.txt
          grep -Fq 'android.intent.category.HOME' release-launcher/manifest.txt
          grep -Fq 'com.boop.shieldhome.ShieldStartupManagerActivity' release-launcher/manifest.txt
          grep -Fq 'com.boop.shieldhome.LauncherClosePlayerActivity' release-launcher/manifest.txt
          if grep -Eq 'RECORD_AUDIO|SYSTEM_ALERT_WINDOW|BIND_VOICE_INTERACTION|com.boop.alpha1|com.boop.shieldoverlay' release-launcher/manifest.txt; then exit 1; fi
          "$TOOLS/apksigner" verify --print-certs "$APK" > release-launcher/signer.txt
          ACTUAL="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' release-launcher/signer.txt | tr -d '\r\n' | tr '[:upper:]' '[:lower:]')"
          EXPECTED="$(tr -d '\r\n' < shield-overlay/signing/boop-dev-cert-sha256.txt | tr '[:upper:]' '[:lower:]')"
          test -n "$ACTUAL"; test "$ACTUAL" = "$EXPECTED"
          python scripts/verify-shield-launcher-apk.py "$APK"
          cp "$APK" release-launcher/BOOP-Launcher.apk
          (cd release-launcher && sha256sum BOOP-Launcher.apk > apk-sha256.txt)
          git rev-parse HEAD > release-launcher/built-commit.txt
          cp shield-launcher/SOURCE.md release-launcher/source.txt
          printf 'Nonvisual build/package/signature/functional checks passed. No physical installation or visual acceptance performed.\n' > release-launcher/verification.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BOOP-Launcher
          path: release-launcher/
          if-no-files-found: error
          retention-days: 90
      - name: Remove runner signing file
        if: always()
        run: rm -f "${RUNNER_TEMP}/boop-dev.jks"
