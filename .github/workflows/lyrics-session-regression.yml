name: Lyrics session continuity regression
on:
  push:
    branches: ['boop-lyrics-lab-side-by-side-v157']
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  session-behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python3 tests/test_lyrics_lab_session.py
      # No emulator, screenshots, golden images or visual acceptance on GitHub.
