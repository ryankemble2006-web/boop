name: Test Shield HOME models

on:
  push:
    branches: [ "boop-unified" ]
    paths:
      - 'unified/shield-home/**'
      - '.github/workflows/test-shield-home-models.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boop-shield-home-models-${{ github.ref }}
  cancel-in-progress: true

jobs:
  models:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Keep this lane independent from unrelated unified materialisation work.
      # The temporary checkout receives the same Shield HOME Java sources/tests,
      # compiled inside the existing Shield Android project. No repo files are rewritten.
      - name: Install Shield HOME source and tests into Shield test project
        shell: bash
        run: |
          set -euo pipefail
          MAIN=shield-overlay/app/src/main/java/com/boop/shieldhome
          TEST=shield-overlay/app/src/test/java/com/boop/shieldhome
          mkdir -p "$MAIN" "$TEST"
          cp -R unified/shield-home/src/main/java/com/boop/shieldhome/. "$MAIN/"
          cp -R unified/shield-home/src/test/java/com/boop/shieldhome/. "$TEST/"

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
          cache-read-only: false

      - name: Run Shield HOME model contracts
        run: gradle --no-daemon -p shield-overlay :app:testDebugUnitTest --tests 'com.boop.shieldhome.*' --stacktrace
