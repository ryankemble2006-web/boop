name: Build signed BOOP Shield v211 room panel
on:
  push:
    branches: [boop-shield-home-panel-v211]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shield-room-panel-v211-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify room panel contract and preserved Shield surfaces
        run: |
          python -m pip install -q pytest
          python -m pytest -q tests/test_shield_room_controls_panel.py tests/test_shield_weather_panel.py tests/test_close_player_app_identity.py tests/test_now_playing_artist_chrome.py
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
          cache-read-only: true
      - name: Prepare test dependencies
        run: |
          python -m pip install -q pytest pyyaml
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Existing inherited functional and source-preservation gates
        run: python split/run-inherited-checks.py
      - name: Materialize both shells and execute focused integration checks
        run: |
          python scripts/audit-split-input.py
          python scripts/materialize-split.py
          python -m pytest -q tests/test_wall_shield_split.py tests/test_split_setup_and_integration.py tests/test_now_playing_artist_chrome.py tests/test_close_player_app_identity.py tests/test_shield_weather_panel.py tests/test_shield_room_controls_panel.py
      - name: Prepare existing permanent BOOP signer
        env:
          BOOP_DEV_KEYSTORE_B64: ${{ secrets.BOOP_DEV_KEYSTORE_B64 }}
          BOOP_DEV_STORE_PASSWORD: ${{ secrets.BOOP_DEV_STORE_PASSWORD }}
          BOOP_DEV_KEY_PASSWORD: ${{ secrets.BOOP_DEV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in BOOP_DEV_KEYSTORE_B64 BOOP_DEV_STORE_PASSWORD BOOP_DEV_KEY_PASSWORD; do test -n "${!name:-}"; done
          printf '%s' "$BOOP_DEV_KEYSTORE_B64" | base64 --decode > "${RUNNER_TEMP}/boop-dev.jks"
          chmod 600 "${RUNNER_TEMP}/boop-dev.jks"
          echo "BOOP_SIGNING_STORE_FILE=${RUNNER_TEMP}/boop-dev.jks" >> "$GITHUB_ENV"
      - name: Build Wall v207 and Shield v211 with the unchanged permanent key
        env:
          BOOP_DEV_STORE_PASSWORD: ${{ secrets.BOOP_DEV_STORE_PASSWORD }}
          BOOP_DEV_KEY_PASSWORD: ${{ secrets.BOOP_DEV_KEY_PASSWORD }}
          BOOP_RELAY_URL: ${{ secrets.BOOP_RELAY_URL }}
          BOOP_RELAY_TOKEN: ${{ secrets.BOOP_RELAY_TOKEN }}
        run: gradle --no-daemon -p boop-build/BOOP-Alpha1 :wall-app:assembleDebug :shield-app:assembleDebug --stacktrace
      - name: Verify actual signed APKs and preserved native/art bytes
        run: python split/verify-apks.py
      - uses: actions/upload-artifact@v4
        with:
          name: BOOP-Shield-v211-Wall-v207-Signed
          path: split-artifact/
          if-no-files-found: error
      - name: Remove temporary signer
        if: always()
        run: rm -f "${RUNNER_TEMP}/boop-dev.jks"
