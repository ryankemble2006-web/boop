name: Deezer favourite controls checks
on:
  push:
    branches: [boop-shield-weather-focus-v221]
    paths:
      - 'tests/test_deezer_favourites.py'
      - 'tests/test_deezer_invisible_hearts.py'
      - 'tests/test_deezer_flow_button.py'
      - 'tests/test_deezer_queue.py'
      - 'tests/test_lyrics_queue.py'
      - 'tests/test_deezer_native_receipts.py'
      - 'tests/java/DeezerReceiptRaceProbe.java'
      - 'unified/AdbCommandReceipt.java'
      - 'unified/DeezerNativeController.java'
      - 'unified/shield-home/src/main/java/com/boop/shieldhome/*Queue*.java'
      - 'unified/shield-home/src/main/java/com/boop/shieldhome/*Flow*.java'
      - 'unified/deezer-bridge/**'
      - 'unified/BoopDeezerHeartBackend.java'
      - 'tests/favourite_android_boundary.py'
      - 'unified/shield-home/src/main/java/com/boop/shieldhome/*Favourite*.java'
      - '.github/workflows/test-deezer-favourites.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Favourite behaviour checks
        run: |
          python -m pip install -q pytest
          python -m pytest -q tests/test_deezer_favourites.py tests/test_deezer_invisible_hearts.py tests/test_deezer_flow_button.py tests/test_deezer_queue.py tests/test_lyrics_queue.py tests/test_deezer_native_receipts.py
