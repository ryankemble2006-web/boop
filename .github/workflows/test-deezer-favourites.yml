name: Deezer favourite controls checks
on:
  push:
    branches: [boop-shield-weather-focus-v221]
    paths:
      - 'tests/test_deezer_favourites.py'
      - 'unified/shield-home/src/main/java/com/boop/shieldhome/*Favourite*.java'
      - '.github/workflows/test-deezer-favourites.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Export tracked source for scoped review
        run: git archive --format=zip --output=boop-source-review.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: BOOP-Favourite-Source-Review
          path: boop-source-review.zip
          retention-days: 1
      - name: Favourite behaviour checks
        run: |
          python -m pip install -q pytest
          python -m pytest -q tests/test_deezer_favourites.py
