name: Build BOOP Shield Fullscreen Deezer

on:
  push:
    branches: [ "boop-shield-fullscreen-deezer-wip" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boop-shield-fullscreen-deezer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BOOP_DEV_KEYSTORE_B64: ${{ secrets.BOOP_DEV_KEYSTORE_B64 }}
      BOOP_DEV_STORE_PASSWORD: ${{ secrets.BOOP_DEV_STORE_PASSWORD }}
      BOOP_DEV_KEY_PASSWORD: ${{ secrets.BOOP_DEV_KEY_PASSWORD }}

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4

      - name: Run BOOP source regressions
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Copy approved BOOP eye artwork
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/boop-alpha1"
          unzip -q BOOP-Alpha1-project.zip -d "${RUNNER_TEMP}/boop-alpha1"
          ASSET="$(find "${RUNNER_TEMP}/boop-alpha1" -type f -name 'boop_eyes.png' -print -quit)"
          test -n "$ASSET"
          mkdir -p shield-overlay/app/src/main/res/drawable-nodpi
          cp "$ASSET" shield-overlay/app/src/main/res/drawable-nodpi/boop_eyes.png

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Run Shield unit tests
        run: gradle -p shield-overlay :app:testDebugUnitTest --stacktrace

      - name: Prepare stable BOOP development signing
        shell: bash
        run: |
          set -euo pipefail
          for name in BOOP_DEV_KEYSTORE_B64 BOOP_DEV_STORE_PASSWORD BOOP_DEV_KEY_PASSWORD; do
            test -n "${!name:-}"
          done
          printf '%s' "$BOOP_DEV_KEYSTORE_B64" | base64 --decode > "${RUNNER_TEMP}/boop-dev.jks"
          chmod 600 "${RUNNER_TEMP}/boop-dev.jks"
          echo "BOOP_SIGNING_STORE_FILE=${RUNNER_TEMP}/boop-dev.jks" >> "$GITHUB_ENV"

      - name: Build signed Shield APK
        run: gradle --no-daemon -p shield-overlay :app:assembleDebug --stacktrace

      - name: Verify package, permissions and signer
        shell: bash
        run: |
          set -euo pipefail
          APK=shield-overlay/app/build/outputs/apk/debug/app-debug.apk
          TOOLS="${ANDROID_HOME}/build-tools/36.0.0"
          "$TOOLS/aapt" dump badging "$APK" | tee badging.txt
          "$TOOLS/aapt" dump permissions "$APK" | tee permissions.txt
          grep -q "package: name='com.boop.shieldoverlay'" badging.txt
          for required in android.permission.SYSTEM_ALERT_WINDOW android.permission.FOREGROUND_SERVICE android.permission.FOREGROUND_SERVICE_SPECIAL_USE; do
            grep -q "$required" permissions.txt
          done
          for forbidden in android.permission.RECORD_AUDIO android.permission.RECEIVE_BOOT_COMPLETED android.permission.BIND_ACCESSIBILITY_SERVICE; do
            ! grep -q "$forbidden" permissions.txt
          done
          "$TOOLS/apksigner" verify --print-certs "$APK" | tee signer.txt
          ACTUAL="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' signer.txt | tr -d '\r\n' | tr '[:upper:]' '[:lower:]')"
          EXPECTED="$(tr -d '\r\n' < shield-overlay/signing/boop-dev-cert-sha256.txt | tr '[:upper:]' '[:lower:]')"
          test -n "$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          sha256sum "$APK" | tee apk-sha256.txt
          git rev-parse HEAD | tee built-commit.txt

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: BOOP-Shield-Fullscreen-Deezer
          path: shield-overlay/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
