name: Test BOOP v204 Home layout
on:
  push:
    branches: [boop-hand-colour-v191]
    paths:
      - 'tests/test_home_layout_v204.py'
      - 'unified/shield-home/src/main/java/com/boop/shieldhome/ShieldHomeView.java'
      - 'unified/app-build.gradle'
      - '.github/workflows/build-boop-v191-hand-colour.yml'
      - '.github/workflows/test-home-layout-v204.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify parked Home layout contract
        run: |
          python -m pip install -q pytest
          python -m pytest -q tests/test_home_layout_v204.py
