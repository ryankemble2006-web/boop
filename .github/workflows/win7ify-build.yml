name: BOOP Win7ify

on:
  workflow_dispatch:
  push:
    branches:
      - boop-win7ify-v01
    paths:
      - 'win7ify/**'
      - '.github/workflows/win7ify-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Show SDK
        run: dotnet --info

      - name: Run Win7ify core tests
        run: dotnet run --project win7ify/tests/Win7ify.Tests/Win7ify.Tests.csproj -c Release

      - name: Publish Win7ify
        shell: pwsh
        run: |
          dotnet publish win7ify/src/Win7ify/Win7ify.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o publish/win-x64

      - name: Write SHA-256 receipt
        shell: pwsh
        run: |
          $hash = (Get-FileHash publish/win-x64/Win7ify.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Win7ify.exe" | Set-Content publish/win-x64/Win7ify.sha256.txt
          Get-Content publish/win-x64/Win7ify.sha256.txt

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: BOOP-Win7ify-v0.1-win-x64
          path: |
            publish/win-x64/Win7ify.exe
            publish/win-x64/Win7ify.sha256.txt
          if-no-files-found: error
          retention-days: 30