name: BOOP Win7ify
on:
  workflow_dispatch:
  push:
    branches: [boop-win7ify-v01]
    paths: ['win7ify/**', '.github/workflows/win7ify-build.yml']
permissions:
  contents: read
concurrency:
  group: boop-win7ify-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Verify approved BOOP eyes
        shell: pwsh
        run: |
          $actual = (Get-FileHash win7ify/src/Win7ify/Assets/boopApprovedEyes.png -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne 'ffbd67af22c2f11b4a109bd83e8c5197c266a777df2fbc97ce1ab5163e9fed22') { throw 'Approved eye bytes changed' }
      - name: Prepare pinned official Open-Shell payload
        shell: pwsh
        run: ./win7ify/tools/Prepare-Payload.ps1
      - name: Run original recovery regression tests
        run: dotnet run --project win7ify/tests/Win7ify.Tests -c Release
      - name: Run new shell recovery contracts
        run: dotnet run --project win7ify/tests/Win7ify.ShellTests -c Release
      - name: Publish self-contained EXE
        run: dotnet publish win7ify/src/Win7ify/Win7ify.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o publish/win-x64
      - name: Non-visual opening and closing smoke
        shell: pwsh
        run: |
          $p = Start-Process (Resolve-Path publish/win-x64/Win7ify.exe) -PassThru
          if (!$p.WaitForInputIdle(20000)) { throw 'GUI did not reach input-ready' }
          Start-Sleep -Seconds 2
          $p.Refresh()
          if ($p.HasExited -or $p.MainWindowHandle -eq 0) { throw 'GUI did not create a window' }
          if (!$p.CloseMainWindow() -or !$p.WaitForExit(10000)) { throw 'GUI did not close normally' }
          if ($p.ExitCode -ne 0) { throw 'GUI exited abnormally' }
          $p.Dispose()
      - name: Real installer and recovery integration cycle
        shell: pwsh
        run: ./win7ify/tools/Test-Integration.ps1 -Exe publish/win-x64/Win7ify.exe
      - name: Package verified EXE and receipt
        shell: pwsh
        run: |
          $hash = (Get-FileHash publish/win-x64/Win7ify.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Win7ify.exe" | Set-Content publish/win-x64/Win7ify.sha256.txt
          Copy-Item win7ify/THIRD_PARTY_NOTICES.txt publish/win-x64/
          Copy-Item win7ify/README.md publish/win-x64/
          "Built from $env:GITHUB_SHA; run $env:GITHUB_RUN_ID. Installer/profile/standalone-menu/uninstall checks passed. Yoga Explorer-hook and appearance acceptance remain unverified." | Set-Content publish/win-x64/BUILD-RECEIPT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BOOP-Win7ify-v0.2.0-win-x64
          path: publish/win-x64/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve non-visual test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Win7ify-v0.2.0-integration-evidence
          path: integration-receipts/
          if-no-files-found: warn
          retention-days: 14
      - name: Source review bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Win7ify-source-review
          path: |
            win7ify/
            .github/workflows/win7ify-build.yml
            !win7ify/**/bin/**
            !win7ify/**/obj/**
            !win7ify/src/Win7ify/Payload/**
          include-hidden-files: true
          retention-days: 7
