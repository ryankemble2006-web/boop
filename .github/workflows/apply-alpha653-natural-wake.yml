name: Apply BOOP Alpha 6.5.3 Natural Wake Patch

on:
  push:
    branches: [ "alpha6.5.3-natural-wake-cook" ]
    paths:
      - 'scripts/patch-alpha653-natural-wake.py'
      - '.github/workflows/apply-alpha653-natural-wake.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: alpha6.5.3-natural-wake-cook
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded Alpha 6.5.3 patch
        run: python3 scripts/patch-alpha653-natural-wake.py
      - name: Commit production patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name boop-ci
          git config user.email boop-ci@users.noreply.github.com
          git add source/MainActivity.java source/app-build.gradle
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add natural wake phrases, wake cue and manners sleep"
          git push origin HEAD:alpha6.5.3-natural-wake-cook
