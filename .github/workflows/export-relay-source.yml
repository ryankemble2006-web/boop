name: Export current Wall source for relay work
on:
  push:
    branches: [boop-relay-source-7aa871f]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Download and verify pinned public JVM test libraries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deps
          python3 - <<'PY'
          import hashlib, urllib.request
          from pathlib import Path
          jars = [
              'com/squareup/okhttp3/okhttp/4.12.0/okhttp-4.12.0.jar',
              'com/squareup/okio/okio-jvm/3.6.0/okio-jvm-3.6.0.jar',
              'org/jetbrains/kotlin/kotlin-stdlib/1.9.10/kotlin-stdlib-1.9.10.jar',
              'org/jetbrains/kotlin/kotlin-stdlib-common/1.9.10/kotlin-stdlib-common-1.9.10.jar',
              'org/jetbrains/annotations/13.0/annotations-13.0.jar',
              'org/json/json/20240303/json-20240303.jar',
              'junit/junit/4.13.2/junit-4.13.2.jar',
              'org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar',
          ]
          for jar in jars:
              url = 'https://repo.maven.apache.org/maven2/' + jar
              data = urllib.request.urlopen(url, timeout=30).read()
              expected = urllib.request.urlopen(url + '.sha1', timeout=30).read().decode().split()[0]
              if hashlib.sha1(data).hexdigest() != expected:
                  raise SystemExit('Public library checksum mismatch')
              dest = Path('deps') / jar.rsplit('/', 1)[1]
              dest.write_bytes(data)
              print(dest.name, hashlib.sha256(data).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: BOOP-relay-public-jvm-libraries
          path: deps/*.jar
          retention-days: 1
          if-no-files-found: error
