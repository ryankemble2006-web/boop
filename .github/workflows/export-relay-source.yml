name: Read-only relay commit receipt
on:
  push:
    branches: [boop-relay-source-7aa871f]
permissions:
  contents: read
jobs:
  receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 59554c143c7237dda1534bb5f5d7fec3a4d19cdd
          fetch-depth: 1
          persist-credentials: false
      - name: Export public commit metadata only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 59554c143c7237dda1534bb5f5d7fec3a4d19cdd
          git cat-file commit HEAD > "${RUNNER_TEMP}/relay-commit.raw"
          test "$(git hash-object -t commit "${RUNNER_TEMP}/relay-commit.raw")" = 59554c143c7237dda1534bb5f5d7fec3a4d19cdd
      - uses: actions/upload-artifact@v4
        with:
          name: BOOP-relay-public-commit-receipt
          path: ${{ runner.temp }}/relay-commit.raw
          retention-days: 1
          if-no-files-found: error
