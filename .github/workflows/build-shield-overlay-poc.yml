name: Build BOOP Shield Overlay POC

on:
  workflow_dispatch:
  push:
    branches: [ "boop-shield-overlay-poc", "boop-shield-home-implementation" ]
    paths:
      - "shield-overlay/**"
      - "scripts/**"
      - "tests/test_shield_overlay_source.py"
      - "tests/test_boop_signing.py"
      - ".github/workflows/build-shield-overlay-poc.yml"
      - "BOOP-Alpha1-project.zip"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BOOP_DEV_KEYSTORE_B64: ${{ secrets.BOOP_DEV_KEYSTORE_B64 }}
      BOOP_DEV_STORE_PASSWORD: ${{ secrets.BOOP_DEV_STORE_PASSWORD }}
      BOOP_DEV_KEY_PASSWORD: ${{ secrets.BOOP_DEV_KEY_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run BOOP source regression suite
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Copy approved BOOP eye artwork
        run: |
          rm -rf "${RUNNER_TEMP}/boop-alpha1"
          unzip -q BOOP-Alpha1-project.zip -d "${RUNNER_TEMP}/boop-alpha1"
          ASSET="$(find "${RUNNER_TEMP}/boop-alpha1" -type f -name 'boop_eyes.png' -print -quit)"
          if [ -z "$ASSET" ]; then
            echo "Approved boop_eyes.png not found in BOOP-Alpha1-project.zip"
            find "${RUNNER_TEMP}/boop-alpha1" -type f | sort
            exit 1
          fi
          mkdir -p shield-overlay/app/src/main/res/drawable-nodpi
          cp "$ASSET" shield-overlay/app/src/main/res/drawable-nodpi/boop_eyes.png
          file shield-overlay/app/src/main/res/drawable-nodpi/boop_eyes.png

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Prepare stable BOOP development signing
        shell: bash
        run: |
          set -euo pipefail
          for name in BOOP_DEV_KEYSTORE_B64 BOOP_DEV_STORE_PASSWORD BOOP_DEV_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret: ${name}"
              exit 1
            fi
          done
          printf '%s' "$BOOP_DEV_KEYSTORE_B64" | base64 --decode > "${RUNNER_TEMP}/boop-dev.jks"
          chmod 600 "${RUNNER_TEMP}/boop-dev.jks"
          echo "BOOP_SIGNING_STORE_FILE=${RUNNER_TEMP}/boop-dev.jks" >> "$GITHUB_ENV"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Run Shield unit tests
        run: gradle -p shield-overlay :app:testDebugUnitTest --stacktrace

      - name: Build Shield overlay APK
        run: gradle -p shield-overlay :app:assembleDebug --stacktrace

      - name: Inspect package and permissions
        run: |
          APK=shield-overlay/app/build/outputs/apk/debug/app-debug.apk
          AAPT="${ANDROID_HOME}/build-tools/36.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee badging.txt
          "$AAPT" dump permissions "$APK" | tee permissions.txt
          grep -q "package: name='com.boop.shieldoverlay'" badging.txt
          for forbidden in android.permission.RECORD_AUDIO android.permission.INTERNET android.permission.ACCESS_NETWORK_STATE android.permission.RECEIVE_BOOT_COMPLETED android.permission.BIND_ACCESSIBILITY_SERVICE; do
            if grep -q "$forbidden" permissions.txt; then
              echo "Forbidden permission present: $forbidden"
              exit 1
            fi
          done

      - name: Verify stable BOOP signer
        shell: bash
        run: |
          set -euo pipefail
          APK=shield-overlay/app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --print-certs "$APK" | tee signer.txt
          ACTUAL="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' signer.txt | tr -d '\r\n' | tr '[:upper:]' '[:lower:]')"
          EXPECTED="$(tr -d '\r\n' < shield-overlay/signing/boop-dev-cert-sha256.txt | tr '[:upper:]' '[:lower:]')"
          test -n "$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Upload BOOP Shield Overlay POC APK
        uses: actions/upload-artifact@v4
        with:
          name: BOOP-Shield-Overlay-POC-debug
          path: shield-overlay/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
