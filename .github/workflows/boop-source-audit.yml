name: BOOP source audit
on:
  push:
    branches: [boop-unified]
    paths: [.github/workflows/boop-source-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read the existing pinned wake assets
        run: |
          bash scripts/fetch-wake-assets.sh audit-app
          mkdir -p wake-audit
          cp .cache/boop-wake/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01/bpe.model wake-audit/
          cp .cache/boop-wake/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01/tokens.txt wake-audit/
          cp -R .cache/boop-wake/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01/test_wavs wake-audit/
          git archive --format=zip --output=wake-audit/source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: BOOP-Wake-Audit
          path: wake-audit/
          retention-days: 3
          if-no-files-found: error
