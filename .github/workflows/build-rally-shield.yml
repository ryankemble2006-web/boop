name: Build BOOP Rally Shield
on:
  push:
    branches: [boop-rally-shield]
    paths-ignore: ['**.md', 'docs/**', 'BOOP_MEMORY.txt']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rally-shield-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Android build components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;26.3.11579264"
      - name: Behavioral tests
        run: python -m unittest discover -s rally-shield/tests -v
      - uses: actions/cache@v4
        with:
          path: rally-shield/vendor
          key: rally-dosbox-a4a0bab7-ndk26-abi64-v1
      - name: Build native ARM64 emulator and Android host
        run: python rally-shield/tools/build_apk.py
      - name: Sign with existing permanent BOOP signer
        shell: bash
        env:
          BOOP_DEV_KEYSTORE_B64: ${{ secrets.BOOP_DEV_KEYSTORE_B64 }}
          BOOP_DEV_STORE_PASSWORD: ${{ secrets.BOOP_DEV_STORE_PASSWORD }}
          BOOP_DEV_KEY_PASSWORD: ${{ secrets.BOOP_DEV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in BOOP_DEV_KEYSTORE_B64 BOOP_DEV_STORE_PASSWORD BOOP_DEV_KEY_PASSWORD; do test -n "${!name:-}"; done
          printf '%s' "$BOOP_DEV_KEYSTORE_B64" | base64 --decode > "${RUNNER_TEMP}/rally-boop.jks"
          chmod 600 "${RUNNER_TEMP}/rally-boop.jks"
          mkdir -p rally-shield/release
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" sign --ks "${RUNNER_TEMP}/rally-boop.jks" --ks-key-alias boop-dev --ks-pass env:BOOP_DEV_STORE_PASSWORD --key-pass env:BOOP_DEV_KEY_PASSWORD --out rally-shield/release/BOOP-Rally.apk rally-shield/build/BOOP-Rally-unsigned.apk
      - name: Verify identity, permanent signature and public-content boundaries
        run: |
          python rally-shield/tools/verify_apk.py rally-shield/release/BOOP-Rally.apk
          git rev-parse HEAD > rally-shield/release/built-commit.txt
          cp rally-shield/build/corresponding-source.tar.gz rally-shield/release/
          cp rally-shield/LICENSE rally-shield/NOTICE.txt rally-shield/release/
          printf 'Behavior/build/package/signature checks passed. Game content is not included. Physical racing, sound, controller and save acceptance remain separate.\n' > rally-shield/release/verification.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BOOP-Rally-Shield
          path: rally-shield/release/
          if-no-files-found: error
          retention-days: 90
      - name: Remove runner signing file
        if: always()
        run: rm -f "${RUNNER_TEMP}/rally-boop.jks"
