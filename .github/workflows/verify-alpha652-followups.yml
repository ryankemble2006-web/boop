name: Verify BOOP Alpha 6.5.2 Assistant Followups

on:
  push:
    branches: [ "alpha6.5.2-assistant-followups" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run follow-up regression tests
        run: python3 -m unittest tests/test_alpha652_assistant_followups.py -v
