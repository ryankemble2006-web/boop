name: Test BOOP v198 voice profile
on:
  push:
    branches: [boop-hand-colour-v191]
    paths:
      - 'tests/test_v198_voice_profile_controls.py'
      - 'source/BoopAppearanceActivity.java'
      - 'source/BoopVoiceController.java'
      - 'source/SharedVoiceProfile*.java'
      - 'source/BoopSharedVoiceProfileRuntime.java'
      - 'unified/UnifiedApplication.java'
      - '.github/workflows/test-v198-voice-profile.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: boop-v198-voice-profile-test
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_v198_voice_profile_controls.py
