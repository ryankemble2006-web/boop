name: Build BOOP v199 centred favourites lab
on:
  push:
    branches: [boop-home-centred-favourites-lab-v199]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: boop-v199-centred-favourites-lab
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify centred Home stage contract
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_home_stage_contract_v199.py
      - name: Verify hand colour, pixel preservation and stale updates
        run: python tests/test_hand_colour_v191.py
      - name: Verify locked default and coherent felt sign anatomy
        run: python tests/test_felt_signs_v190.py
      - name: Verify rounded lower lip and full eye coverage
        run: python tests/test_rounded_lid_v189.py
      - name: Verify moving photographic outline at all four ends
        run: python tests/test_moving_lid_coverage_v188.py
      - name: Verify frozen and scrubbed felt review
        run: python tests/test_felt_review_lab_v187.py
      - name: Compile shader and verify felt material isolation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y glslang-tools
          python tests/test_png_puppet_v181.py
      - name: Verify Johnny state isolation
        run: python tests/test_johnny_states_v175.py
      - name: Verify fan power excludes oscillation
        run: python tests/test_johnny_fan_power_v176.py
      - name: Verify lyrics album routing
        run: python tests/test_unified_lyrics_activity.py
      - name: Verify relaxed playback groove
        run: python tests/test_relaxed_groove_v174.py
      - name: Verify bass attack detection
        run: python tests/test_bass_onset_v173.py
      - name: Verify bass energy and capture lifetime
        run: python tests/test_bass_capture_v172.py
      - name: Verify silent screensaver preserves audio routing
        run: |
          mkdir -p "$RUNNER_TEMP/audio-policy"
          javac -d "$RUNNER_TEMP/audio-policy" unified/shield-home/src/main/java/com/boop/shieldhome/AudioModePolicy.java source-test/AudioModePolicyTest.java
          java -cp "$RUNNER_TEMP/audio-policy" com.boop.shieldhome.AudioModePolicyTest
      - name: Test real direct-output music levels
        run: |
          python tests/test_playback_dance_v169.py
          python tests/test_music_renderer_v167.py
      - name: Reproduce and verify reply startup lifecycle
        run: |
          python tests/test_voice_startup_v166.py --source-only
          bash scripts/materialize-unified.sh
          python tests/test_voice_startup_v166.py
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
          cache-read-only: true
      - name: Prepare Android SDK and test tools
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          python -m pip install pytest
      - name: Preserve native lyrics and independent blink timing
        run: |
          python -m pytest -q tests/test_unified_v70_natural_voices_contract.py
          python -m pytest -q tests/test_shared_eye_colour.py::test_colour_state_and_protocol tests/test_shared_eye_colour.py::test_colour_binding_covers_existing_renderers_without_replacements tests/test_shared_eye_colour.py::test_runtime_is_opt_in_and_reuses_saved_home_assistant_auth tests/test_shared_eye_colour.py::test_appearance_screen_is_private_and_available_in_the_apk tests/test_shared_eye_colour.py::test_appearance_screen_reuses_wall_hue_and_does_not_enable_sharing_on_open
          cmp source/AnimationReviewTimeline.java boop-build/BOOP-Alpha1/app/src/main/java/com/boop/alpha1/AnimationReviewTimeline.java
          cmp source/BoopCanonicalAnimationActivity.java boop-build/BOOP-Alpha1/app/src/main/java/com/boop/alpha1/BoopCanonicalAnimationActivity.java
          cmp source/BoopAppearanceActivity.java boop-build/BOOP-Alpha1/app/src/main/java/com/boop/alpha1/BoopAppearanceActivity.java
          cmp unified/animation/java/com/boop/eyes/FeltFringeMesh.java boop-build/BOOP-Alpha1/animation-lib/src/main/java/com/boop/eyes/FeltFringeMesh.java
          cmp unified/animation/assets/felt-fringe.vert boop-build/BOOP-Alpha1/animation-lib/src/main/assets/felt-fringe.vert
          cmp unified/animation/assets/felt-fringe.frag boop-build/BOOP-Alpha1/animation-lib/src/main/assets/felt-fringe.frag
          bash scripts/test-unified-native-lyrics.sh
          python tests/test_hand_sharing_v191.py
          python tests/test_animation_speed.py
          python tests/test_materialized_speed.py
          python scripts/verify-accepted-felt.py --materialized boop-build/BOOP-Alpha1
          python -m pytest -q tests/test_felt_sharing_v180.py::FeltSharing::test_protocol_state_and_helper_isolation
          python -m pytest -q tests/test_now_playing_canonical_only.py tests/test_notification_canonical_only.py tests/test_unified_face_ownership.py tests/test_now_playing_bay_ownership.py
          cmp unified/shield-home/src/main/java/com/boop/shieldhome/MusicBounceSource.java boop-build/BOOP-Alpha1/shield-home-lib/src/main/java/com/boop/shieldhome/MusicBounceSource.java
          cmp unified/shield-home/src/main/java/com/boop/shieldhome/ShieldNowPlayingPuppetView.java boop-build/BOOP-Alpha1/shield-home-lib/src/main/java/com/boop/shieldhome/ShieldNowPlayingPuppetView.java
          cmp unified/shield-home/src/main/java/com/boop/shieldhome/ShieldHomeView.java boop-build/BOOP-Alpha1/shield-home-lib/src/main/java/com/boop/shieldhome/ShieldHomeView.java
      - name: Prepare existing permanent BOOP signer
        env:
          BOOP_DEV_KEYSTORE_B64: ${{ secrets.BOOP_DEV_KEYSTORE_B64 }}
          BOOP_DEV_STORE_PASSWORD: ${{ secrets.BOOP_DEV_STORE_PASSWORD }}
          BOOP_DEV_KEY_PASSWORD: ${{ secrets.BOOP_DEV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in BOOP_DEV_KEYSTORE_B64 BOOP_DEV_STORE_PASSWORD BOOP_DEV_KEY_PASSWORD; do test -n "${!name:-}"; done
          printf '%s' "$BOOP_DEV_KEYSTORE_B64" | base64 --decode > "${RUNNER_TEMP}/boop-dev.jks"
          chmod 600 "${RUNNER_TEMP}/boop-dev.jks"
          echo "BOOP_SIGNING_STORE_FILE=${RUNNER_TEMP}/boop-dev.jks" >> "$GITHUB_ENV"
      - name: Build signed centred favourites lab candidate for joint device testing
        env:
          BOOP_DEV_STORE_PASSWORD: ${{ secrets.BOOP_DEV_STORE_PASSWORD }}
          BOOP_DEV_KEY_PASSWORD: ${{ secrets.BOOP_DEV_KEY_PASSWORD }}
          BOOP_RELAY_URL: ${{ secrets.BOOP_RELAY_URL }}
          BOOP_RELAY_TOKEN: ${{ secrets.BOOP_RELAY_TOKEN }}
        run: gradle --no-daemon -p boop-build/BOOP-Alpha1 :app:assembleDebug --stacktrace
      - name: Verify signed APK identity, lyrics activity and bounce bytecode
        run: |
          set -euo pipefail
          APK=boop-build/BOOP-Alpha1/app/build/outputs/apk/debug/app-debug.apk
          TOOLS="${ANDROID_HOME}/build-tools/36.0.0"
          mkdir -p v199-artifact
          "$TOOLS/aapt" dump badging "$APK" > v199-artifact/badging.txt
          grep -Fq "package: name='com.boop.alpha1'" v199-artifact/badging.txt
          grep -Fq "versionCode='199'" v199-artifact/badging.txt
          grep -Fq "versionName='1.2.199-centred-favourites-lab'" v199-artifact/badging.txt
          "$TOOLS/aapt" dump xmltree "$APK" AndroidManifest.xml > v199-artifact/manifest-tree.txt
          grep -Fq 'com.boop.alpha1.johnny_states' v199-artifact/manifest-tree.txt
          grep -Fq 'com.boop.shieldhome.ShieldLyricsActivity' v199-artifact/manifest-tree.txt
          grep -Fq 'com.boop.shieldhome.MusicAudioPermissionActivity' v199-artifact/manifest-tree.txt
          "$TOOLS/apksigner" verify --print-certs "$APK" > v199-artifact/signer.txt
          ACTUAL="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' v199-artifact/signer.txt | tr -d '\r\n' | tr '[:upper:]' '[:lower:]')"
          EXPECTED="$(tr -d '\r\n' < shield-overlay/signing/boop-dev-cert-sha256.txt | tr '[:upper:]' '[:lower:]')"
          test -n "$ACTUAL"; test "$ACTUAL" = "$EXPECTED"
          unzip -tq "$APK"
          python - <<'PY'
          from pathlib import Path
          import zipfile
          apk=Path('boop-build/BOOP-Alpha1/app/build/outputs/apk/debug/app-debug.apk')
          with zipfile.ZipFile(apk) as z:
              for name in ('boop-png-study.png','boop-hidden-felt.png','boop-felt-sign-blank.png'):
                  assert z.read('assets/'+name) == Path('unified/animation/assets/'+name).read_bytes(), 'Fringe shader packaging mismatch'
              assert z.read('assets/eyes.frag') == Path('unified/animation/assets/eyes.frag').read_bytes(), 'Packaged shader differs from source'
              assert z.read('assets/boopApprovedEyes.png') == Path('unified/assets/boop-eyes/boopApprovedEyes.png').read_bytes(), 'Packaged eye master differs from source'
              dex=b''.join(z.read(n) for n in z.namelist() if n.startswith('classes') and n.endswith('.dex'))
          for cls in ('BassCaptureService','BassEnergy','BassOnset','PlaybackGroove','PlaybackMusicDance','MusicBounceSource','MusicBounceEnvelope','MusicBounceRenderer','ShieldLyricsActivity','ShieldHomeView'):
              assert ('Lcom/boop/shieldhome/'+cls+';').encode() in dex, 'Missing packaged class: '+cls
          assert b'Lcom/boop/alpha1/AnimationReviewTimeline;' in dex, 'Felt timeline missing from APK'
          assert b'Lcom/boop/eyes/PngPuppetRig;' in dex, 'PNG rig missing from APK'
          for cls in ('FeltPalette','FeltColourPreferences','HandColourPixels','HandColourPreferences','HandColourBinding','HandColourWork'):
              assert ('Lcom/boop/eyes/'+cls+';').encode() in dex, 'Missing felt class: '+cls
          for cls in ('BoopSharedFeltColourRuntime','SharedFeltColourProtocol','SharedFeltColourLink','BoopSharedHandColourRuntime','SharedHandColourProtocol','SharedHandColourHaProtocol','SharedHandColourLink','BoopAppearanceActivity'):
              assert ('Lcom/boop/alpha1/'+cls+';').encode() in dex, 'Missing felt UI/transport: '+cls
          print('Actual APK contains Home assistant presence, native lyrics and music sampler/envelope/renderer bytecode')
          PY
          cp "$APK" v199-artifact/BOOP-Unified-v199-Centred-Favourites-Lab.apk
          (cd v199-artifact && sha256sum BOOP-Unified-v199-Centred-Favourites-Lab.apk > apk-sha256.txt)
          git rev-parse HEAD > v199-artifact/built-commit.txt
          printf '%s\n' 'Forked from Unified fdd8c9a. Accepted v191 appearance/hand sharing and v197 media handoff preserved. Home uses a stable independent stage: top controls and unchanged 182dp Now Playing slot stay fixed, Favourite apps heading is removed, the unchanged favourites banner row is vertically centred, and the 360x220 idle BOOP is docked bottom-right. Eligible Now Playing still hands ownership to the small BOOP.' 'No emulator or hosted visual acceptance. Ryan owns layout and visual acceptance on the real Shield.' > v199-artifact/verification.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BOOP-Unified-v199-Centred-Favourites-Lab
          path: v199-artifact/
          if-no-files-found: error
      - name: Remove temporary signer
        if: always()
        run: rm -f "${RUNNER_TEMP}/boop-dev.jks"
