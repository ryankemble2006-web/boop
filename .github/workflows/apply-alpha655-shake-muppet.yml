name: Apply BOOP Alpha 6.5.5 Shake Muppet

on:
  push:
    branches: [ "alpha6.5.5-shake-muppet" ]
    paths:
      - 'scripts/patch-alpha655-shake-muppet.py'
      - '.github/workflows/apply-alpha655-shake-muppet.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: alpha6.5.5-shake-muppet
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded Alpha 6.5.5 patch
        run: python3 scripts/patch-alpha655-shake-muppet.py
      - name: Commit production patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name boop-ci
          git config user.email boop-ci@users.noreply.github.com
          git add source/MainActivity.java source/BoopFaceView.java
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add shake-to-wake Muppet eye ricochet"
          git push origin HEAD:alpha6.5.5-shake-muppet
