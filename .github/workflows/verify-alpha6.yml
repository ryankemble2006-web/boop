name: Verify BOOP Alpha 6 OpenCode ChatGPT

on:
  push:
    branches: [ "alpha6-opencode-chatgpt", "alpha6.1-thinking-puppet", "alpha6.2-muppet-voice", "alpha6.3-voice-sliders", "alpha6.4-wake-word" ]
  workflow_dispatch:

concurrency:
  group: boop-alpha6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bridge test dependencies
        run: python -m pip install 'aiohttp==3.14.3' 'wyoming==1.10.0'
      - name: Run Python bridge and source tests
        run: |
          python3 -m unittest bridge/test_boop_wyoming_bridge.py -v
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Materialize editable BOOP project
        run: bash scripts/materialize-android.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Run Android unit tests
        run: gradle -p boop-build/BOOP-Alpha1 :app:testDebugUnitTest --stacktrace
