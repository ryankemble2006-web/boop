name: Verify BOOP Alpha 6 OpenCode ChatGPT

on:
  push:
    branches: [ "alpha6-opencode-chatgpt" ]
  workflow_dispatch:

concurrency:
  group: boop-alpha6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bridge test dependencies
        run: python -m pip install 'aiohttp==3.14.3' 'wyoming==1.10.0'
      - name: Run Python bridge and source tests
        run: |
          python3 -m unittest bridge/test_boop_wyoming_bridge.py -v
          python3 -m unittest discover -s tests -p 'test_*.py' -v
