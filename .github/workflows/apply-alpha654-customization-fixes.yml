name: Apply BOOP Alpha 6.5.4 Customization Fixes

on:
  push:
    branches: [ "alpha6.5.4-customization-fixes" ]
    paths:
      - 'scripts/patch-alpha654-customization-fixes.py'
      - '.github/workflows/apply-alpha654-customization-fixes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: alpha6.5.4-customization-fixes
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded Alpha 6.5.4 patch
        run: python3 scripts/patch-alpha654-customization-fixes.py
      - name: Commit production patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name boop-ci
          git config user.email boop-ci@users.noreply.github.com
          git add source/MainActivity.java source/BoopSherpaWakeSpotter.java source/BoopWakeWordController.java source/app-build.gradle
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add wake sensitivity slider and finish sleep/cue fixes"
          git push origin HEAD:alpha6.5.4-customization-fixes
