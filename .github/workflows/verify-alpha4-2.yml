name: Verify BOOP Alpha 4.2 House Routing

on:
  push:
    branches: [ "alpha4.2-house-routing-restore" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run source regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Materialize Android project
        run: bash scripts/materialize-android.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Run Android unit tests
        run: gradle -p boop-build/BOOP-Alpha1 :app:testDebugUnitTest --stacktrace
