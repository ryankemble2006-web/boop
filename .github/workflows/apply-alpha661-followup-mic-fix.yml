name: Apply Alpha 6.6.1 follow-up mic fix

on:
  push:
    branches: [ "alpha6.6.1-followup-mic-handoff" ]
    paths: [ "scripts/apply-alpha661-followup-mic-fix.py" ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: alpha6.6.1-followup-mic-handoff
          fetch-depth: 0
      - name: Apply bounded follow-up mic fix
        run: python3 scripts/apply-alpha661-followup-mic-fix.py
      - name: Commit source fix
        run: |
          set -euo pipefail
          git config user.name "boop-ci"
          git config user.email "boop-ci@users.noreply.github.com"
          git add source/MainActivity.java
          git diff --cached --exit-code && exit 1 || true
          git commit -m "Keep wake mic blocked through timed follow-up handoff"
          git push origin HEAD:alpha6.6.1-followup-mic-handoff
