name: Verify signed BOOP Launcher Alpha 1
on:
  push:
    branches: [boop-launcher-alpha1]
    paths: ['launcher/scripts/drag_smoke.py']
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful signed build run to verify
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: BOOP-Launcher-Alpha1-signed
          path: launcher-delivery
          run-id: ${{ inputs.build_run_id || '34058128961' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise existing signed APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_7_pro
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: python3 launcher/scripts/drag_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BOOP-Launcher-emulator-evidence
          path: launcher-evidence/
