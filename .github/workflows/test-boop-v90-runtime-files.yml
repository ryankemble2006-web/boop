name: Test BOOP v90 Natural Runtime Files

on:
  push:
    branches: [ "boop-natural-v90-runtime-files" ]
    paths:
      - 'source/BoopNaturalSpeechBackend.java'
      - 'natural-voices/manifest.json'
      - 'tests/test_unified_v85_natural_voice_install_flow.py'
      - '.github/workflows/test-boop-v90-runtime-files.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Check natural runtime-file contract
        run: python -m pytest -q tests/test_unified_v85_natural_voice_install_flow.py

# v90 green rerun after removing non-existent inno runtime requirements.
