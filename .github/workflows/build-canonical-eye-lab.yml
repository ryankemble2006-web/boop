name: Build canonical eye animation lab
on:
  workflow_dispatch:
  push:
    branches: [animation-idle-blink-cleanup]
    paths: ['animation-lab/canonical-eyes/**', '.github/workflows/build-canonical-eye-lab.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare catalogue and run nonvisual state tests
        run: |
          python -m pip install Pillow
          python animation-lab/canonical-eyes/tools/prepare.py --out work/canonical-eyes-build
          mkdir -p work/state-tests
          javac -d work/state-tests animation-lab/canonical-eyes/java/com/boop/eyes/EyeMotion.java work/canonical-eyes-build/java/com/boop/eyes/EyeCatalogue.java animation-lab/canonical-eyes/tests/MotionTest.java
          java -cp work/state-tests MotionTest
          javac -d work/state-tests animation-lab/canonical-eyes/java/com/boop/eyes/EyeMotion.java animation-lab/canonical-eyes/java/com/boop/eyes/SignMotion.java animation-lab/canonical-eyes/tests/SignMotionTest.java
          java -cp work/state-tests SignMotionTest
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Android build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Prepare existing permanent BOOP signer
        env:
          BOOP_DEV_KEYSTORE_B64: ${{ secrets.BOOP_DEV_KEYSTORE_B64 }}
          BOOP_DEV_STORE_PASSWORD: ${{ secrets.BOOP_DEV_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$BOOP_DEV_KEYSTORE_B64"
          printf '%s' "$BOOP_DEV_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/boop-dev.jks"
          chmod 600 "$RUNNER_TEMP/boop-dev.jks"
          keytool -list -keystore "$RUNNER_TEMP/boop-dev.jks" -storepass "$BOOP_DEV_STORE_PASSWORD" -alias boop-dev >/dev/null
          echo "BOOP_SIGNING_STORE_FILE=$RUNNER_TEMP/boop-dev.jks" >> "$GITHUB_ENV"
      - name: Compile, sign, and verify focused lab
        env:
          BOOP_DEV_STORE_PASSWORD: ${{ secrets.BOOP_DEV_STORE_PASSWORD }}
          BOOP_DEV_KEY_PASSWORD: ${{ secrets.BOOP_DEV_KEY_PASSWORD }}
        run: bash animation-lab/canonical-eyes/tools/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BOOP-Canonical-Eye-Lab-v9
          path: |
            work/canonical-eyes-build/BOOP-Animation-Lab-v9.apk
            work/canonical-eyes-build/apk-sha256.txt
            work/canonical-eyes-build/built-commit.txt
            work/canonical-eyes-build/badging.txt
            work/canonical-eyes-build/signer.txt
          if-no-files-found: error
      - name: Remove ephemeral signer
        if: always()
        run: rm -f "$RUNNER_TEMP/boop-dev.jks"
