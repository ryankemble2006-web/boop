name: Inspect Alpha 6.4 Task 4 APK

on:
  push:
    branches: [ "alpha6.4-wake-word" ]
    paths:
      - '.github/workflows/inspect-alpha64-task4-apk.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 36 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Materialize pinned wake build
        run: bash scripts/materialize-android.sh
      - name: Assemble and inspect wake runtime
        shell: bash
        run: |
          set -euo pipefail
          gradle -p boop-build/BOOP-Alpha1 :app:assembleDebug --stacktrace
          APK=boop-build/BOOP-Alpha1/app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep 'sherpa-onnx-jni'
          unzip -l "$APK" | grep 'assets/boop-kws/encoder-epoch-12-avg-2-chunk-16-left-64.int8.onnx'
          unzip -l "$APK" | grep 'assets/boop-kws/decoder-epoch-12-avg-2-chunk-16-left-64.onnx'
          unzip -l "$APK" | grep 'assets/boop-kws/keywords.txt'
