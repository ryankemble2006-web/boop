name: Johnny native arm64
on:
  push:
    branches: [johnny-ha-native-v8]
    paths: ['johnny-ha/**', '.github/workflows/johnny-native.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: HA state edge tests
        run: python3 johnny-ha/tests/state_edges_test.py
      - name: Native policy tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror johnny-ha/tests/control_test.c -o /tmp/control-test
          /tmp/control-test
      - name: Fetch pinned open source
        run: |
          git clone https://github.com/jno6809/jc_reborn.git /tmp/reborn
          git -C /tmp/reborn checkout 524a5803e4fa65f840379c781f40ce39a927032e
          curl --fail --location https://github.com/libsdl-org/SDL/releases/download/release-2.30.11/SDL2-2.30.11.tar.gz -o /tmp/sdl.tar.gz
          mkdir /tmp/sdl
          tar xzf /tmp/sdl.tar.gz -C /tmp/sdl --strip-components=1
          python3 johnny-ha/native/patch_upstream.py /tmp/reborn
      - name: Ownership and cancellation under sanitizers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsdl2-dev
          cc -std=c11 -D_POSIX_C_SOURCE=200809L -g -fsanitize=address,undefined -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" -I/tmp/reborn -Ijohnny-ha/native $(sdl2-config --cflags) johnny-ha/tests/runtime_test.c $(sdl2-config --libs) -lpthread -o /tmp/runtime-test
          ASAN_OPTIONS=detect_leaks=1 /tmp/runtime-test
      - name: Install pinned NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" > /dev/null
      - name: Build silent software engine
        run: |
          cmake -S johnny-ha/native -B /tmp/native-build -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DREBORN_SOURCE=/tmp/reborn -DSDL_SOURCE=/tmp/sdl -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/native-build --parallel 2
          mkdir -p /tmp/deliverable/arm64-v8a
          cp /tmp/native-build/libjohnny.so /tmp/deliverable/arm64-v8a/
          "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" -D --defined-only /tmp/native-build/libjohnny.so > /tmp/deliverable/native-symbols.txt
          if grep -Eq '[[:space:]]JNI_OnLoad
          cp /tmp/reborn/LICENSE /tmp/deliverable/JOHNNY-REBORN-LICENSE
          cp /tmp/sdl/LICENSE.txt /tmp/deliverable/SDL-LICENSE.txt
          cp -r johnny-ha /tmp/deliverable/source
          sha256sum /tmp/deliverable/arm64-v8a/libjohnny.so
      - name: Compile Android View
        run: |
          mkdir /tmp/java-classes
          javac -source 8 -target 8 -classpath "$ANDROID_HOME/platforms/android-35/android.jar" -d /tmp/java-classes johnny-ha/java/local/johnnycastaway/shield/*.java
          jar cf /tmp/deliverable/johnny-view.jar -C /tmp/java-classes .
          "$ANDROID_HOME/build-tools/35.0.0/d8" --lib "$ANDROID_HOME/platforms/android-35/android.jar" --min-api 26 --output /tmp/deliverable /tmp/deliverable/johnny-view.jar
      - uses: actions/upload-artifact@v4
        with:
          name: johnny-native-arm64
          path: /tmp/deliverable
 /tmp/deliverable/native-symbols.txt; then echo "Unexpected SDL JNI loader"; exit 1; fi
          tar --exclude=.git -czf /tmp/deliverable/johnny-reborn-patched-source.tar.gz -C /tmp/reborn .
          cp /tmp/sdl.tar.gz /tmp/deliverable/SDL2-2.30.11-source.tar.gz
          git rev-parse HEAD > /tmp/deliverable/built-commit.txt
          cp /tmp/reborn/LICENSE /tmp/deliverable/JOHNNY-REBORN-LICENSE
          cp /tmp/sdl/LICENSE.txt /tmp/deliverable/SDL-LICENSE.txt
          cp -r johnny-ha /tmp/deliverable/source
          sha256sum /tmp/deliverable/arm64-v8a/libjohnny.so
      - name: Compile Android View
        run: |
          mkdir /tmp/java-classes
          javac -source 8 -target 8 -classpath "$ANDROID_HOME/platforms/android-35/android.jar" -d /tmp/java-classes johnny-ha/java/local/johnnycastaway/shield/*.java
          jar cf /tmp/deliverable/johnny-view.jar -C /tmp/java-classes .
          "$ANDROID_HOME/build-tools/35.0.0/d8" --lib "$ANDROID_HOME/platforms/android-35/android.jar" --min-api 26 --output /tmp/deliverable /tmp/deliverable/johnny-view.jar
      - uses: actions/upload-artifact@v4
        with:
          name: johnny-native-arm64
          path: /tmp/deliverable
