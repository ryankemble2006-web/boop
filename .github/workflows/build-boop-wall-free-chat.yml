name: Build BOOP Wall Free Chat candidate

on:
  push:
    branches: [ "boop-wall-free-chat-wip", "boop-relay-reviewed-v34" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boop-wall-free-chat-${{ github.ref }}
  cancel-in-progress: true

# Explicit build-only marker is used only when Ryan requests no tests.
# Ordinary pushes and manual runs retain the full existing verification path.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_SERIAL: emulator-5554

    steps:
      - name: Check out the exact candidate with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Protect the preserved voice, eyes, wake assets and companion source
        if: ${{ !contains(github.event.head_commit.message, '[boop-build-only]') }}
        shell: bash
        run: |
          set -euo pipefail
          BASE=3a702f89b7f317649d267f25c34c6c9655edcff8
          git diff --exit-code "$BASE" HEAD -- source/ wake-assets/ scripts/ \
            ':(exclude)source/BoopCommandRouter.java' \
            ':(exclude)source/OpenAiRelayConfig.java' \
            ':(exclude)source/OpenAiRelayAssistantClient.java' \
            ':(exclude)source/CommandOutcome.java' \
            ':(exclude)source/LocalReply.java' \
            ':(exclude)source/BoopChatMode.java' \
            ':(exclude)source/BoopChatModeHold.java' \
            ':(exclude)source/BoopChatModeStore.java' \
            ':(exclude)source/BoopFreeChat.java' \
            ':(exclude)source/BoopFreeChatNotice.java' \
            ':(exclude)source/BoopIdleBlink.java' \
            ':(exclude)source/app-build.gradle' \
            ':(exclude)source/AndroidManifest.xml' \
            ':(exclude)scripts/materialize-android.sh' \
            ':(exclude)scripts/patch-wall-chat-mode.py' \
            ':(exclude)scripts/patch-wall-idle-blink.py' \
            ':(exclude)scripts/smoke-wall-chat-mode.py'
          ! grep -R -n -E 'BoopTimedRoutineFlow|Once or recurring\?|Recurring routines need setup first' source/
          test "$(git hash-object source/MainActivity.java)" = bcfedf104d8aadb0f75aa26c66fd65e700862b50

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.12
        if: ${{ !contains(github.event.head_commit.message, '[boop-build-only]') }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install existing bridge test dependencies
        if: ${{ !contains(github.event.head_commit.message, '[boop-build-only]') }}
        run: python -m pip install 'aiohttp==3.14.3' 'wyoming==1.10.0'

      - name: Run bridge, source and chat-routing regression tests
        if: ${{ !contains(github.event.head_commit.message, '[boop-build-only]') }}
        run: |
          python3 -m unittest bridge/test_boop_wyoming_bridge.py -v
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Set up Node for isolated relay tests
        if: ${{ !contains(github.event.head_commit.message, '[boop-build-only]') }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Worker protocol without live provider traffic
        if: ${{ !contains(github.event.head_commit.message, '[boop-build-only]') }}
        working-directory: relay/cloudflare
        run: npm test

      - name: Run preserved shake and conversation-exit harnesses
        if: ${{ !contains(github.event.head_commit.message, '[boop-build-only]') }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/boop-shake-tests /tmp/boop-shake-motion-tests /tmp/boop-exit-tests
          javac -d /tmp/boop-shake-tests source/BoopShakeDetector.java tests/java/BoopShakeDetectorHarness.java
          java -cp /tmp/boop-shake-tests com.boop.alpha1.BoopShakeDetectorHarness
          javac -d /tmp/boop-shake-motion-tests source/BoopShakeEyeMotion.java tests/java/BoopShakeEyeMotionHarness.java
          java -cp /tmp/boop-shake-motion-tests com.boop.alpha1.BoopShakeEyeMotionHarness
          javac -d /tmp/boop-exit-tests source/BoopConversationExitIntent.java tests/java/BoopConversationExitIntentHarness.java
          java -cp /tmp/boop-exit-tests com.boop.alpha1.BoopConversationExitIntentHarness

      - name: Materialize BOOP with the reviewed chat-mode delta
        run: bash scripts/materialize-android.sh

      - name: Verify effective source and all natural-wake mappings
        if: ${{ !contains(github.event.head_commit.message, '[boop-build-only]') }}
        shell: bash
        run: |
          set -euo pipefail
          APP=boop-build/BOOP-Alpha1/app
          grep -q 'BOOP_CHAT_MODE_V1' "$APP/src/main/java/com/boop/alpha1/MainActivity.java"
          grep -q 'wakeTranscriptAccumulator.chooseFinal' "$APP/src/main/java/com/boop/alpha1/MainActivity.java"
          grep -q 'toastEgg.matches' "$APP/src/main/java/com/boop/alpha1/MainActivity.java"
          test "$(grep -c '@BOOP$' "$APP/src/main/assets/boop-kws/keywords.txt")" -eq 33
          test -s "$APP/libs/sherpa-onnx-1.13.7.aar"
          sha256sum "$APP/src/main/java/com/boop/alpha1/MainActivity.java" > effective-source-sha256.txt

      - name: Set up Android SDK
        if: ${{ !contains(github.event.head_commit.message, '[boop-build-only]') }}
        uses: android-actions/setup-android@v3

      - name: Install the existing Android 36 toolchain and emulator image
        if: ${{ !contains(github.event.head_commit.message, '[boop-build-only]') }}
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "emulator" "system-images;android-36;google_apis;x86_64"

      - name: Reuse installed build tools only; no emulator or tests requested
        if: ${{ contains(github.event.head_commit.message, '[boop-build-only]') }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "${ANDROID_HOME}/platforms/android-36/android.jar" ] || [ ! -x "${ANDROID_HOME}/build-tools/36.0.0/apksigner" ]; then
            "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          fi
          sha256sum boop-build/BOOP-Alpha1/app/src/main/java/com/boop/alpha1/MainActivity.java > effective-source-sha256.txt
          echo 'Tests and emulator runs skipped at Ryan request.' > verification-level.txt

      - name: Set up the existing Gradle version
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Run Android unit tests
        if: ${{ !contains(github.event.head_commit.message, '[boop-build-only]') }}
        run: gradle -p boop-build/BOOP-Alpha1 :app:testDebugUnitTest --stacktrace

      - name: Prepare the existing permanent BOOP signer
        shell: bash
        env:
          BOOP_DEV_KEYSTORE_B64: ${{ secrets.BOOP_DEV_KEYSTORE_B64 }}
          BOOP_DEV_STORE_PASSWORD: ${{ secrets.BOOP_DEV_STORE_PASSWORD }}
          BOOP_DEV_KEY_PASSWORD: ${{ secrets.BOOP_DEV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in BOOP_DEV_KEYSTORE_B64 BOOP_DEV_STORE_PASSWORD BOOP_DEV_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing existing signing secret: $name"
              exit 1
            fi
          done
          printf '%s' "$BOOP_DEV_KEYSTORE_B64" | base64 --decode > "${RUNNER_TEMP}/boop-dev.jks"
          chmod 600 "${RUNNER_TEMP}/boop-dev.jks"
          keytool -list -keystore "${RUNNER_TEMP}/boop-dev.jks" -storepass "$BOOP_DEV_STORE_PASSWORD" -alias boop-dev >/dev/null
          echo "BOOP_SIGNING_STORE_FILE=${RUNNER_TEMP}/boop-dev.jks" >> "$GITHUB_ENV"

      - name: Build the stable-signed Wall v34 candidate
        env:
          BOOP_DEV_STORE_PASSWORD: ${{ secrets.BOOP_DEV_STORE_PASSWORD }}
          BOOP_DEV_KEY_PASSWORD: ${{ secrets.BOOP_DEV_KEY_PASSWORD }}
          BOOP_RELAY_URL: ${{ secrets.BOOP_RELAY_URL }}
          BOOP_RELAY_TOKEN: ${{ secrets.BOOP_RELAY_TOKEN }}
          BOOP_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: gradle -p boop-build/BOOP-Alpha1 :app:assembleDebug --stacktrace

      - name: Build separate instrumentation only for the full verification path
        if: ${{ !contains(github.event.head_commit.message, '[boop-build-only]') }}
        env:
          BOOP_DEV_STORE_PASSWORD: ${{ secrets.BOOP_DEV_STORE_PASSWORD }}
          BOOP_DEV_KEY_PASSWORD: ${{ secrets.BOOP_DEV_KEY_PASSWORD }}
          BOOP_RELAY_URL: ${{ secrets.BOOP_RELAY_URL }}
          BOOP_RELAY_TOKEN: ${{ secrets.BOOP_RELAY_TOKEN }}
          BOOP_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: gradle -p boop-build/BOOP-Alpha1 :app:assembleDebugAndroidTest --stacktrace

      - name: Verify package, version, archive and signer continuity
        shell: bash
        run: |
          set -euo pipefail
          APK=boop-build/BOOP-Alpha1/app/build/outputs/apk/debug/app-debug.apk
          TOOLS="${ANDROID_HOME}/build-tools/36.0.0"
          "$TOOLS/aapt" dump badging "$APK" > badging.txt
          grep -q "package: name='com.boop.alpha1'" badging.txt
          grep -q "versionCode='34'" badging.txt
          grep -q "versionName='0.4.14-wall-native-chat'" badging.txt
          "$TOOLS/apksigner" verify --print-certs "$APK" > signer.txt
          ACTUAL="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' signer.txt | tr -d '\r\n' | tr '[:upper:]' '[:lower:]')"
          EXPECTED="$(tr -d '\r\n' < shield-overlay/signing/boop-dev-cert-sha256.txt | tr '[:upper:]' '[:lower:]')"
          test -n "$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          unzip -tq "$APK"
          sha256sum "$APK" > apk-sha256.txt
          git rev-parse HEAD > built-commit.txt
          python3 - <<'PYCONFIG'
          from pathlib import Path
          p = Path('boop-build/BOOP-Alpha1/app/build/generated/source/buildConfig/debug/com/boop/alpha1/BuildConfig.java')
          text = p.read_text()
          empty = 'BOOP_RELAY_URL = "";' in text or 'BOOP_RELAY_TOKEN = "";' in text
          Path('relay-config-state.txt').write_text('setup-required\n' if empty else 'configured-private-prototype\n')
          PYCONFIG

      - name: Enable emulator KVM
        if: ${{ !contains(github.event.head_commit.message, '[boop-build-only]') }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Boot a disposable Android 16 Pixel 7 Pro emulator
        if: ${{ !contains(github.event.head_commit.message, '[boop-build-only]') }}
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_AVD_HOME="${RUNNER_TEMP}/android-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n boop-chat-test -k "system-images;android-36;google_apis;x86_64" --device "pixel_7_pro"
          nohup "${ANDROID_HOME}/emulator/emulator" -avd boop-chat-test -port 5554 -no-window -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data > emulator.log 2>&1 &
          if ! timeout 300s bash -c 'adb wait-for-device && until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 2; done'; then
            tail -n 100 emulator.log
            exit 1
          fi
          echo 'BOOP_EMULATOR_BOOTED=1'
          adb shell input keyevent 82 || true

      - name: Select and verify the emulator supplied-audio recognizer
        if: ${{ !contains(github.event.head_commit.message, '[boop-build-only]') }}
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          ON_DEVICE_RECOGNIZER=''
          RECOGNITION_SERVICES=''
          # First boot may report completion before package services are ready.
          # Retain the proven component requirement and the real audio-read gate.
          for attempt in {1..30}; do
            if RECOGNITION_SERVICES="$(adb shell cmd package query-services --brief --components --user 0 -a android.speech.RecognitionService 2>&1)"; then
              ON_DEVICE_RECOGNIZER="$(printf '%s\n' "$RECOGNITION_SERVICES" | tr -d '\r' | grep '^com\.google\.android\.as/' | head -n 1 || true)"
              if [ -n "$ON_DEVICE_RECOGNIZER" ]; then break; fi
            fi
            sleep 2
          done
          printf '%s\n' "$RECOGNITION_SERVICES"
          if [ -z "$ON_DEVICE_RECOGNIZER" ]; then
            echo '::error::Expected Android System Intelligence recognition service was not discovered'
            adb shell settings get secure voice_recognition_service || true
            adb shell pm list packages | grep -E 'google.*(as|tts|search)' || true
            exit 1
          fi
          adb shell settings put secure voice_recognition_service "$ON_DEVICE_RECOGNIZER"
          SELECTED_RECOGNIZER="$(adb shell settings get secure voice_recognition_service | tr -d '\r')"
          test "$SELECTED_RECOGNIZER" = "$ON_DEVICE_RECOGNIZER"
          echo 'BOOP_EMULATOR_RECOGNIZER_SELECTED=1'

      - name: Verify the signed app starts with the real wake microphone armed
        if: ${{ !contains(github.event.head_commit.message, '[boop-build-only]') }}
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          adb install -r boop-build/BOOP-Alpha1/app/build/outputs/apk/debug/app-debug.apk
          adb shell pm grant com.boop.alpha1 android.permission.RECORD_AUDIO
          adb logcat -c
          adb shell am start -W -n com.boop.alpha1/.MainActivity
          WAKE_ARMED=0
          for attempt in {1..30}; do
            adb logcat -d -v raw -s BOOP-Wake:I '*:S' > wake-activation.log
            if grep -Fxq 'Wake microphone armed' wake-activation.log; then WAKE_ARMED=1; break; fi
            sleep 1
          done
          test "$WAKE_ARMED" -eq 1
          adb shell pidof com.boop.alpha1

      - name: Exercise the menu, persistence, revert and gesture cancellation
        if: ${{ !contains(github.event.head_commit.message, '[boop-build-only]') }}
        run: python3 scripts/smoke-wall-chat-mode.py

      - name: Verify readable notice, actual idle blink, sleep deadline and lifecycle
        if: ${{ !contains(github.event.head_commit.message, '[boop-build-only]') }}
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          test "$(adb get-serialno)" = emulator-5554
          adb shell am force-stop com.boop.alpha1
          adb install -r boop-build/BOOP-Alpha1/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb logcat -c
          trap 'adb logcat -d -v threadtime -s NotificationService:V Toast:V ToastUI:V SystemUIToast:V AndroidRuntime:E "*:S" > wall-polish-system.log' EXIT
          adb shell am instrument -w com.boop.alpha1.test/com.boop.alpha1.WallPolishInstrumentation | tee wall-polish-instrumentation.txt
          grep -q 'PASS: styled notice, visible background toast, awake blink' wall-polish-instrumentation.txt
          grep -q 'INSTRUMENTATION_CODE: -1' wall-polish-instrumentation.txt

      - name: Collect disposable-emulator polish evidence
        if: ${{ always() && !contains(github.event.head_commit.message, '[boop-build-only]') }}
        continue-on-error: true
        run: adb pull /sdcard/Android/data/com.boop.alpha1/files/wall-polish-evidence wall-polish-evidence

      - name: Publish disposable-emulator polish evidence
        if: ${{ always() && !contains(github.event.head_commit.message, '[boop-build-only]') }}
        uses: actions/upload-artifact@v4
        with:
          name: BOOP-Wall-v34-polish-evidence
          path: |
            wall-polish-instrumentation.txt
            wall-polish-system.log
            wall-polish-evidence/
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify the existing Shield pairing return route
        if: ${{ !contains(github.event.head_commit.message, '[boop-build-only]') }}
        run: |
          adb shell am start -W -a android.intent.action.VIEW -d 'boop://shield-pair-return?sid=test' com.boop.alpha1
          sleep 2
          adb shell dumpsys activity activities | grep -E 'com\.boop\.alpha1/.ShieldPairingActivity'
          adb shell pidof com.boop.alpha1

      - name: Upload candidate APK and public build fingerprints
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BOOP-Wall-Free-Chat-candidate
          path: |
            boop-build/BOOP-Alpha1/app/build/outputs/apk/debug/app-debug.apk
            built-commit.txt
            apk-sha256.txt
            effective-source-sha256.txt
            signer.txt
            badging.txt
            verification-level.txt
            relay-config-state.txt
          if-no-files-found: error

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/boop-dev.jks"
