name: Build native lyrics emulator fixture
on:
  push:
    branches: ['boop-unified-native-lyrics-v157']
    paths:
      - '.github/workflows/native-lyrics-preview.yml'
      - 'scripts/materialize-native-lyrics-preview.py'
      - 'tests/runtime/LyricsPreviewActivity.java'
      - 'unified/shield-home/src/main/java/com/boop/shieldhome/ShieldLyricsView.java'
      - 'unified/shield-home/src/main/java/com/boop/shieldhome/LyricsLinesView.java'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-fixture-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Use existing permanent signer for separate local-test package
        env:
          KEY: ${{ secrets.BOOP_DEV_KEYSTORE_B64 }}
        run: |
          test -n "$KEY"
          printf '%s' "$KEY" | base64 --decode > "$RUNNER_TEMP/boop-dev.jks"
          chmod 600 "$RUNNER_TEMP/boop-dev.jks"
          echo "BOOP_SIGNING_STORE_FILE=$RUNNER_TEMP/boop-dev.jks" >> "$GITHUB_ENV"
      - name: Compile fixture from unchanged production renderer
        env:
          BOOP_DEV_STORE_PASSWORD: ${{ secrets.BOOP_DEV_STORE_PASSWORD }}
          BOOP_DEV_KEY_PASSWORD: ${{ secrets.BOOP_DEV_KEY_PASSWORD }}
        run: |
          python3 scripts/materialize-native-lyrics-preview.py
          gradle --no-daemon -p work/native-lyrics-preview :app:assembleDebug --stacktrace
      - name: Verify separate package and signer
        run: |
          set -euo pipefail
          apk=work/native-lyrics-preview/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep -F "package: name='com.boop.lyricspreview'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" > work/fixture-signer.txt
          expected=$(tr -d '\r\n' < shield-overlay/signing/boop-dev-cert-sha256.txt)
          grep -F "$expected" work/fixture-signer.txt
          unzip -tq "$apk"
          sha256sum "$apk" > work/fixture-sha256.txt
          git rev-parse HEAD > work/fixture-built-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BOOP-Lyrics-Runtime-Fixture
          path: |
            work/native-lyrics-preview/app/build/outputs/apk/debug/app-debug.apk
            work/fixture-signer.txt
            work/fixture-sha256.txt
            work/fixture-built-commit.txt
          if-no-files-found: error
      - name: Remove temporary signer
        if: always()
        run: rm -f "$RUNNER_TEMP/boop-dev.jks"
      # No emulator, screenshot, image comparison or visual execution on GitHub.
