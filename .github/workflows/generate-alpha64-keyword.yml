name: Generate BOOP Alpha 6.4 Keyword Tokens

on:
  push:
    branches: [ "alpha6.4-wake-word" ]
    paths:
      - '.github/workflows/generate-alpha64-keyword.yml'
      - 'wake-assets/boop-kws/keywords_raw.txt'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned sherpa CLI
        run: python -m pip install 'sherpa-onnx==1.13.7'
      - name: Download pinned English KWS model
        shell: bash
        run: |
          set -euo pipefail
          MODEL=sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01-mobile
          curl -fL --retry 3 -o "$MODEL.tar.bz2" \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/kws-models/$MODEL.tar.bz2"
          tar -xjf "$MODEL.tar.bz2"
      - name: Generate BOOP BPE keyword tokens
        shell: bash
        run: |
          set -euo pipefail
          MODEL=sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01-mobile
          sherpa-onnx-cli text2token \
            --tokens "$MODEL/tokens.txt" \
            --tokens-type bpe \
            --bpe-model "$MODEL/bpe.model" \
            wake-assets/boop-kws/keywords_raw.txt \
            keywords.txt
          cat keywords.txt
      - name: Upload generated keyword
        uses: actions/upload-artifact@v4
        with:
          name: BOOP-Alpha64-Generated-Keyword
          path: keywords.txt
          if-no-files-found: error
