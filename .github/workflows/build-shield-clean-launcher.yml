name: Build Shield Clean Launcher APK

on:
  push:
    branches: [ "boop-shield-clean-launcher" ]
    paths:
      - 'shield-clean-launcher/**'
      - 'unified/shield-home/**'
      - '.github/workflows/build-shield-clean-launcher.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shield-clean-launcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out launcher branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Install Android build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Verify locked eye master bytes without visual inspection
        shell: bash
        run: |
          set -euo pipefail
          MASTER=shield-clean-launcher/app/src/main/res/drawable-nodpi/boop_approved_eyes.png
          test -f "$MASTER"
          ACTUAL="$(sha256sum "$MASTER" | awk '{print $1}')"
          test "$ACTUAL" = "ffbd67af22c2f11b4a109bd83e8c5197c266a777df2fbc97ce1ab5163e9fed22"

      - name: Test functional Shield HOME logic (no visual checks)
        env:
          BOOP_SKIP_MANUAL_VISUAL_TESTS: '1'
        run: gradle --no-daemon -p shield-clean-launcher :app:testDebugUnitTest --tests 'com.boop.shieldhome.HomeOverridePolicyTest' --stacktrace

      - name: Prepare permanent BOOP signer
        shell: bash
        env:
          BOOP_DEV_KEYSTORE_B64: ${{ secrets.BOOP_DEV_KEYSTORE_B64 }}
          BOOP_DEV_STORE_PASSWORD: ${{ secrets.BOOP_DEV_STORE_PASSWORD }}
          BOOP_DEV_KEY_PASSWORD: ${{ secrets.BOOP_DEV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in BOOP_DEV_KEYSTORE_B64 BOOP_DEV_STORE_PASSWORD BOOP_DEV_KEY_PASSWORD; do
            test -n "${!name:-}"
          done
          printf '%s' "$BOOP_DEV_KEYSTORE_B64" | base64 --decode > "${RUNNER_TEMP}/boop-dev.jks"
          chmod 600 "${RUNNER_TEMP}/boop-dev.jks"
          keytool -list -keystore "${RUNNER_TEMP}/boop-dev.jks" -storepass "$BOOP_DEV_STORE_PASSWORD" -alias boop-dev >/dev/null
          echo "BOOP_SIGNING_STORE_FILE=${RUNNER_TEMP}/boop-dev.jks" >> "$GITHUB_ENV"

      - name: Build signed standalone launcher
        env:
          BOOP_DEV_STORE_PASSWORD: ${{ secrets.BOOP_DEV_STORE_PASSWORD }}
          BOOP_DEV_KEY_PASSWORD: ${{ secrets.BOOP_DEV_KEY_PASSWORD }}
        run: gradle --no-daemon -p shield-clean-launcher :app:assembleDebug --stacktrace

      - name: Verify standalone package and signer
        shell: bash
        run: |
          set -euo pipefail
          APK=shield-clean-launcher/app/build/outputs/apk/debug/app-debug.apk
          TOOLS="${ANDROID_HOME}/build-tools/36.0.0"
          "$TOOLS/aapt" dump badging "$APK" > badging.txt
          grep -q "package: name='com.boop.shieldhome'" badging.txt
          grep -q "versionCode='23'" badging.txt
          grep -q "versionName='0.10.8-service-reconnect'" badging.txt
          "$TOOLS/aapt" dump xmltree "$APK" AndroidManifest.xml > manifest-tree.txt
          grep -q "android.permission.INTERNET" manifest-tree.txt
          grep -q "com.boop.shieldhome.ShieldLauncherActivity" manifest-tree.txt
          grep -q "com.boop.shieldhome.ShieldHomeOverrideService" manifest-tree.txt
          grep -q "com.boop.shieldhome.ShieldAccessibilityRouteActivity" manifest-tree.txt
          grep -q "com.boop.shieldhome.ShieldNowPlayingListenerService" manifest-tree.txt
          grep -q "android.intent.category.HOME" manifest-tree.txt
          grep -q "android.intent.category.LEANBACK_LAUNCHER" manifest-tree.txt
          grep -q "android.accessibilityservice.AccessibilityService" manifest-tree.txt
          grep -q "android.settings.ACCESSIBILITY_SETTINGS" manifest-tree.txt
          "$TOOLS/aapt" dump resources "$APK" > resources.txt
          grep -q "boop_headphones" resources.txt
          grep -q "boop_approved_eyes" resources.txt
          "$TOOLS/apksigner" verify --print-certs "$APK" > signer.txt
          ACTUAL="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' signer.txt | tr -d '\r\n' | tr '[:upper:]' '[:lower:]')"
          EXPECTED="$(tr -d '\r\n' < shield-overlay/signing/boop-dev-cert-sha256.txt | tr '[:upper:]' '[:lower:]')"
          test -n "$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          unzip -tq "$APK"
          sha256sum "$APK" | tee apk-sha256.txt
          git rev-parse HEAD | tee built-commit.txt

      - name: Upload standalone Shield launcher
        uses: actions/upload-artifact@v4
        with:
          name: BOOP-Shield-Clean-Launcher
          path: |
            shield-clean-launcher/app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
            built-commit.txt
            badging.txt
            signer.txt
          if-no-files-found: error

      - name: Remove temporary signer
        if: always()
        run: rm -f "${RUNNER_TEMP}/boop-dev.jks"
