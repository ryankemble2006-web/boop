name: Build BOOP Wall Launcher Swipe APK

on:
  push:
    branches: [ "boop-wall-launcher-swipe" ]
  workflow_dispatch:

concurrency:
  group: boop-wall-launcher-swipe-${{ github.ref }}
  cancel-in-progress: true

env:
  BOOP_DEV_KEYSTORE_B64: ${{ secrets.BOOP_DEV_KEYSTORE_B64 }}
  BOOP_DEV_STORE_PASSWORD: ${{ secrets.BOOP_DEV_STORE_PASSWORD }}
  BOOP_DEV_KEY_PASSWORD: ${{ secrets.BOOP_DEV_KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run source and swipe regression tests
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          rm -rf /tmp/boop-launcher-swipe-tests
          mkdir -p /tmp/boop-launcher-swipe-tests
          javac -d /tmp/boop-launcher-swipe-tests \
            source/BoopLauncherSwipeGesture.java \
            tests/java/BoopLauncherSwipeGestureHarness.java
          java -cp /tmp/boop-launcher-swipe-tests com.boop.alpha1.BoopLauncherSwipeGestureHarness

      - name: Materialize editable BOOP project
        run: bash scripts/materialize-android.sh

      - name: Set candidate update identity
        shell: bash
        run: |
          set -euo pipefail
          APP=boop-build/BOOP-Alpha1/app/build.gradle
          sed -i 's/versionCode 29/versionCode 30/' "$APP"
          sed -i 's/0.4.9-alpha6.5.6-wall/0.4.10-wall-launcher-swipe/' "$APP"
          grep -q 'versionCode 30' "$APP"
          grep -q '0.4.10-wall-launcher-swipe' "$APP"

      - name: Set up Java and Android build tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Run Android unit tests
        run: gradle -p boop-build/BOOP-Alpha1 :app:testDebugUnitTest --stacktrace

      - name: Prepare permanent BOOP signing key
        shell: bash
        run: |
          set -euo pipefail
          for name in BOOP_DEV_KEYSTORE_B64 BOOP_DEV_STORE_PASSWORD BOOP_DEV_KEY_PASSWORD; do
            test -n "${!name:-}" || { echo "::error::Missing GitHub Actions secret: $name"; exit 1; }
          done
          printf '%s' "$BOOP_DEV_KEYSTORE_B64" | base64 --decode > "${RUNNER_TEMP}/boop-dev.jks"
          chmod 600 "${RUNNER_TEMP}/boop-dev.jks"
          keytool -list -keystore "${RUNNER_TEMP}/boop-dev.jks" -storepass "$BOOP_DEV_STORE_PASSWORD" -alias boop-dev >/dev/null
          echo "BOOP_SIGNING_STORE_FILE=${RUNNER_TEMP}/boop-dev.jks" >> "$GITHUB_ENV"

      - name: Build signed BOOP Wall Launcher Swipe APK
        run: gradle -p boop-build/BOOP-Alpha1 :app:assembleDebug --stacktrace

      - name: Inspect signed candidate APK
        shell: bash
        run: |
          set -euo pipefail
          APK=boop-build/BOOP-Alpha1/app/build/outputs/apk/debug/app-debug.apk
          AAPT="${ANDROID_HOME}/build-tools/36.0.0/aapt"
          APKSIGNER="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          "$AAPT" dump badging "$APK" | tee badging.txt
          grep -q "package: name='com.boop.alpha1'" badging.txt
          grep -q "versionCode='30'" badging.txt
          grep -q "versionName='0.4.10-wall-launcher-swipe'" badging.txt
          "$APKSIGNER" verify --print-certs "$APK" | tee signer.txt
          ACTUAL="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' signer.txt | tr -d '\r\n' | tr '[:upper:]' '[:lower:]')"
          EXPECTED="$(tr -d '\r\n' < shield-overlay/signing/boop-dev-cert-sha256.txt | tr '[:upper:]' '[:lower:]')"
          test -n "$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          unzip -tq "$APK"

      - name: Upload signed BOOP Wall Launcher Swipe APK
        uses: actions/upload-artifact@v4
        with:
          name: BOOP-Wall-Launcher-Swipe-debug
          path: boop-build/BOOP-Alpha1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Set up Android emulator
        uses: android-actions/setup-android@v3

      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Install and boot Android 16 Pixel 7 Pro emulator
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "emulator" "system-images;android-36;google_apis;x86_64"
          export ANDROID_AVD_HOME="${RUNNER_TEMP}/android-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n boop-test -k "system-images;android-36;google_apis;x86_64" --device "pixel_7_pro"
          nohup "${ANDROID_HOME}/emulator/emulator" -avd boop-test -no-window -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data > emulator.log 2>&1 &
          timeout 300s bash -c 'adb wait-for-device && until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 2; done'

      - name: Install and launch signed swipe candidate
        shell: bash
        run: |
          set -euo pipefail
          APK=boop-build/BOOP-Alpha1/app/build/outputs/apk/debug/app-debug.apk
          adb install -r "$APK"
          adb shell pm grant com.boop.alpha1 android.permission.RECORD_AUDIO
          adb shell am start -W -n com.boop.alpha1/.MainActivity
          sleep 5
          adb shell pidof com.boop.alpha1
