name: Check Unified music permission integration
on:
  push:
    branches: [boop-unified-music-v163, boop-unified-eye-sync-safe-v159]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check conditional permission logic and retained v162 app inputs
        run: python3 -m unittest discover -s tests -p 'test_music_*.py' -v
