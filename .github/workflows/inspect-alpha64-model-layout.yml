name: Inspect Alpha 6.4 model layout

on:
  push:
    branches: [ "alpha6.4-wake-word" ]
    paths:
      - '.github/workflows/inspect-alpha64-model-layout.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download and list pinned KWS model archive
        shell: bash
        run: |
          set -euo pipefail
          MODEL='sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01-mobile.tar.bz2'
          curl -fL --retry 3 -o "$MODEL" \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/kws-models/$MODEL"
          echo '=== archive files ==='
          tar -tjf "$MODEL"
