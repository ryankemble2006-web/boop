name: Sign locally built BOOP Shield APK
on:
  workflow_dispatch:
    inputs:
      asset_id:
        description: Draft release asset ID containing the locally built APK
        required: true
      sha256:
        description: Exact SHA256 of the locally verified input
        required: true
permissions:
  contents: read
jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Download exact locally built input
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_ID: ${{ inputs.asset_id }}
          INPUT_SHA256: ${{ inputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "$ASSET_ID" =~ ^[0-9]+$ ]]
          [[ "$INPUT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          gh api -H 'Accept: application/octet-stream' "/repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" > input.apk
          printf '%s  input.apk\n' "$INPUT_SHA256" | sha256sum -c -
      - name: Sign only with unchanged permanent BOOP key
        env:
          BOOP_DEV_KEYSTORE_B64: ${{ secrets.BOOP_DEV_KEYSTORE_B64 }}
          BOOP_DEV_STORE_PASSWORD: ${{ secrets.BOOP_DEV_STORE_PASSWORD }}
          BOOP_DEV_KEY_PASSWORD: ${{ secrets.BOOP_DEV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/boop-dev.jks"' EXIT
          printf '%s' "$BOOP_DEV_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/boop-dev.jks"
          chmod 600 "$RUNNER_TEMP/boop-dev.jks"
          mkdir signed
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f 4 input.apk aligned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/boop-dev.jks" --ks-key-alias boop-dev --ks-pass env:BOOP_DEV_STORE_PASSWORD --key-pass env:BOOP_DEV_KEY_PASSWORD --out signed/BOOP-Shield-v273.apk aligned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs signed/BOOP-Shield-v273.apk > signed/certificate.txt
          grep -F 'Signer #1 certificate SHA-256 digest: f5af40378ef06445b43f6001ae602fc18ce16eefbabdefd23afe178a47b5cdde' signed/certificate.txt
          sha256sum input.apk signed/BOOP-Shield-v273.apk > signed/hashes.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BOOP-Shield-v273-local-build-signed
          path: signed/
          if-no-files-found: error
