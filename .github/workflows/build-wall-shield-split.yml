name: Sign locally built BOOP Shield APK

run-name: Sign BOOP Shield tag ${{ github.ref_name }}

on:
  push:
    tags:
      - 'codex-sign-trigger-v*'

permissions:
  contents: write

concurrency:
  group: shield-sign-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sign-local-apk:
    name: Sign the locally built Shield APK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact local build commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java for Android signing tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Download and validate the temporary draft APK
        id: input
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGN_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SIGN_TAG" =~ ^codex-sign-trigger-v([0-9]+)-([a-f0-9]{8})-([a-f0-9]{8})-([0-9]+)-([0-9]+)$ ]]
          tag_version="$BASH_REMATCH[1]"
          tag_commit="$BASH_REMATCH[2]"
          nonce="$BASH_REMATCH[3]"
          apk_asset_id="$BASH_REMATCH[4]"
          receipt_asset_id="$BASH_REMATCH[5]"
          mkdir -p "$RUNNER_TEMP/input"
          gh api --header 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$apk_asset_id" > "$RUNNER_TEMP/input/local.apk"
          gh api --header 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$receipt_asset_id" > "$RUNNER_TEMP/input/build-receipt.json"
          [[ -s "$RUNNER_TEMP/input/local.apk" && -s "$RUNNER_TEMP/input/build-receipt.json" ]]
          receipt="$RUNNER_TEMP/input/build-receipt.json"
          commit="$(jq -r '.commit' "$receipt")"
          branch="$(jq -r '.branch' "$receipt")"
          version="$(jq -r '.versionCode' "$receipt")"
          version_name="$(jq -r '.versionName' "$receipt")"
          package="$(jq -r '.package' "$receipt")"
          input_sha="$(sha256sum "$RUNNER_TEMP/input/local.apk" | cut -d ' ' -f 1)"
          [[ "$commit" == "$GITHUB_SHA" ]]
          [[ "$commit" == "$tag_commit"* ]]
          [[ "$branch" =~ ^[A-Za-z0-9._/-]+$ ]]
          [[ "$branch" =~ ^shield-v[0-9]+-live$ ]]
          [[ "$package" == 'com.boop.shieldoverlay' ]]
          [[ "$input_sha" == "$(jq -r '.localApkSha256' "$receipt")" ]]
          [[ "$(jq -r '.localUnitTests' "$receipt")" == 'passed' ]]
          [[ "$(jq -r '.gradleVersion' "$receipt")" == '9.6.0' ]]
          [[ "$version" == "$tag_version" ]]
          [[ "$version" =~ ^[0-9]+$ ]]
          [[ "$version_name" == "1.2.$version-shield" ]]

          branch_sha="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$branch" | cut -f1)"
          [[ -n "$branch_sha" ]]
          [[ "$branch_sha" == "$GITHUB_SHA" ]]
          snapshot_file="$(find release-snapshots -mindepth 3 -maxdepth 3 -path '*/shield-app/build.gradle' -type f | sort -V | tail -n 1)"
          [[ -n "$snapshot_file" ]]
          snapshot_dir="$(printf '%s' "$snapshot_file" | sed 's|/shield-app/build.gradle$||')"
          snapshot_version="$(basename "$snapshot_dir" | sed -E 's/^shield-v([0-9]+)$/\1/')"
          current_version="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*$/\1/p' "$snapshot_file" | head -n 1)"
          [[ "$version" == "$snapshot_version" && "$version" == "$current_version" ]]
          printf 'version=%s\nversion_name=%s\n' "$version" "$version_name" >> "$GITHUB_OUTPUT"
          echo "Validated local APK for commit $commit and Shield v$version"

      - name: Verify local APK package, version, and alignment
        env:
          SHIELD_VERSION: ${{ steps.input.outputs.version }}
          SHIELD_VERSION_NAME: ${{ steps.input.outputs.version_name }}
        shell: bash
        run: |
          set -euo pipefail
          apk="$RUNNER_TEMP/input/local.apk"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/package.txt"
          grep -F "package: name='com.boop.shieldoverlay'" "$RUNNER_TEMP/package.txt"
          grep -F "versionCode='$SHIELD_VERSION'" "$RUNNER_TEMP/package.txt"
          grep -F "versionName='$SHIELD_VERSION_NAME'" "$RUNNER_TEMP/package.txt"
          "$tools/zipalign" -c -v 4 "$apk"

      - name: Load the unchanged permanent signing key
        env:
          BOOP_DEV_KEYSTORE_B64: ${{ secrets.BOOP_DEV_KEYSTORE_B64 }}
          BOOP_DEV_STORE_PASSWORD: ${{ secrets.BOOP_DEV_STORE_PASSWORD }}
          BOOP_DEV_KEY_PASSWORD: ${{ secrets.BOOP_DEV_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in BOOP_DEV_KEYSTORE_B64 BOOP_DEV_STORE_PASSWORD BOOP_DEV_KEY_PASSWORD; do
            secret_value="$(printenv "$name" || true)"
            if [[ -z "$secret_value" ]]; then
              echo "::error::Missing existing signing secret: $name"
              exit 1
            fi
          done
          key="$RUNNER_TEMP/boop-dev.jks"
          printf '%s' "$BOOP_DEV_KEYSTORE_B64" | base64 --decode > "$key"
          chmod 600 "$key"
          keytool -list -keystore "$key" -storepass "$BOOP_DEV_STORE_PASSWORD" -alias boop-dev >/dev/null
          echo "BOOP_SIGNING_STORE_FILE=$key" >> "$GITHUB_ENV"

      - name: Apply the permanent GitHub signature
        env:
          SHIELD_VERSION: ${{ steps.input.outputs.version }}
          BOOP_DEV_STORE_PASSWORD: ${{ secrets.BOOP_DEV_STORE_PASSWORD }}
          BOOP_DEV_KEY_PASSWORD: ${{ secrets.BOOP_DEV_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          tools="$ANDROID_HOME/build-tools/36.0.0"
          signed="dist/BOOP-Shield-v$SHIELD_VERSION-signed.apk"
          "$tools/apksigner" sign \
            --ks "$BOOP_SIGNING_STORE_FILE" --ks-key-alias boop-dev \
            --ks-pass env:BOOP_DEV_STORE_PASSWORD --key-pass env:BOOP_DEV_KEY_PASSWORD \
            --out "$signed" "$RUNNER_TEMP/input/local.apk"
          "$tools/apksigner" verify --print-certs "$signed" > dist/certificate.txt
          expected="$(tr -d '[:space:]' < shield-overlay/signing/boop-dev-cert-sha256.txt | tr '[:upper:]' '[:lower:]')"
          grep -F "Signer #1 certificate SHA-256 digest: $expected" dist/certificate.txt
          "$tools/zipalign" -c -v 4 "$signed"
          signed_sha="$(sha256sum "$signed" | cut -d ' ' -f 1)"
          (cd dist && sha256sum "BOOP-Shield-v$SHIELD_VERSION-signed.apk" > SHA256SUMS)
          jq --arg signed_sha "$signed_sha" \
            --arg certificate_sha "$expected" \
            --arg run_id "$GITHUB_RUN_ID" \
            '. + {signedApk: "BOOP-Shield-v\(.versionCode)-signed.apk", signedApkSha256: $signed_sha, permanentCertificateSha256: $certificate_sha, signingWorkflowRun: $run_id}' \
            "$RUNNER_TEMP/input/build-receipt.json" > dist/build-receipt.json

      - name: Upload signed APK and receipt
        uses: actions/upload-artifact@v4
        with:
          name: BOOP-Shield-v${{ steps.input.outputs.version }}-signed
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/boop-dev.jks"
