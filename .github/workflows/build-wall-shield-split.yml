name: Build signed BOOP Shield v230 and Wall v207
on:
  push:
    branches: [boop-wall-shield-split-v207, boop-shield-room-panel-v213, boop-shield-ha-fast-v214, boop-shield-fan-capability-v215, boop-shield-weather-icon-fan-v216, boop-shield-grab-reorder-v217, boop-shield-now-playing-align-v218, boop-shield-now-playing-align-v219, boop-shield-accent-colour-v220, boop-shield-weather-focus-v221]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wall-shield-signed-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify close identity, artist focus and weather before the full build
        run: |
          python -m pip install -q pytest
          python -m pytest -q tests/test_room_panel.py tests/test_close_player_app_identity.py tests/test_now_playing_artist_chrome.py tests/test_now_playing_alignment.py tests/test_launcher_accent_colour.py tests/test_shield_weather_panel.py tests/test_shield_return_focus.py tests/test_lyrics_presentation_chrome.py
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
          # BOOP iterates repeatedly on the active Shield branch. Allow the
          # branch to save its Gradle User Home/local build cache after a
          # successful run so small follow-up builds can reuse it.
          cache-read-only: false
      - name: Prepare test dependencies
        run: |
          python -m pip install -q pytest pyyaml
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Existing v206 functional checks
        run: python split/run-inherited-checks.py
      - name: Materialize both shells and execute focused integration checks
        run: |
          python scripts/audit-split-input.py
          python scripts/materialize-split.py
          python -m pytest -q tests/test_wall_shield_split.py tests/test_split_setup_and_integration.py tests/test_now_playing_artist_chrome.py tests/test_now_playing_alignment.py tests/test_launcher_accent_colour.py tests/test_close_player_app_identity.py tests/test_shield_weather_panel.py tests/test_shield_return_focus.py tests/test_lyrics_presentation_chrome.py
      - name: Prepare existing permanent BOOP signer
        env:
          BOOP_DEV_KEYSTORE_B64: ${{ secrets.BOOP_DEV_KEYSTORE_B64 }}
          BOOP_DEV_STORE_PASSWORD: ${{ secrets.BOOP_DEV_STORE_PASSWORD }}
          BOOP_DEV_KEY_PASSWORD: ${{ secrets.BOOP_DEV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in BOOP_DEV_KEYSTORE_B64 BOOP_DEV_STORE_PASSWORD BOOP_DEV_KEY_PASSWORD; do test -n "${!name:-}"; done
          printf '%s' "$BOOP_DEV_KEYSTORE_B64" | base64 --decode > "${RUNNER_TEMP}/boop-dev.jks"
          chmod 600 "${RUNNER_TEMP}/boop-dev.jks"
          echo "BOOP_SIGNING_STORE_FILE=${RUNNER_TEMP}/boop-dev.jks" >> "$GITHUB_ENV"
      - name: Verify HA room scope and low-latency command path
        env:
          BOOP_DEV_STORE_PASSWORD: ${{ secrets.BOOP_DEV_STORE_PASSWORD }}
          BOOP_DEV_KEY_PASSWORD: ${{ secrets.BOOP_DEV_KEY_PASSWORD }}
        run: |
          TARGET=boop-build/BOOP-Alpha1/shield-lib/src/test/java/com/boop/shieldoverlay
          mkdir -p "$TARGET"
          for file in HomeAssistantRepositoryTest RoomScopedEntitiesTest RoomDeviceControlsTest HaEntityCategoryTest; do
            cp "shield-overlay/app/src/test/java/com/boop/shieldoverlay/$file.java" "$TARGET/"
          done
          gradle --build-cache --no-daemon -p boop-build/BOOP-Alpha1 :shield-lib:testDebugUnitTest --stacktrace
      - name: Build both apps with the unchanged permanent key
        env:
          BOOP_DEV_STORE_PASSWORD: ${{ secrets.BOOP_DEV_STORE_PASSWORD }}
          BOOP_DEV_KEY_PASSWORD: ${{ secrets.BOOP_DEV_KEY_PASSWORD }}
          BOOP_RELAY_URL: ${{ secrets.BOOP_RELAY_URL }}
          BOOP_RELAY_TOKEN: ${{ secrets.BOOP_RELAY_TOKEN }}
        run: gradle --build-cache --no-daemon -p boop-build/BOOP-Alpha1 :wall-app:assembleDebug :shield-app:assembleDebug --stacktrace
      - name: Verify BOTH actual APKs against accepted v206 native bytes and frozen art
        run: |
          python split/verify-apks.py
          cp -R boop-build/BOOP-Alpha1/shield-lib/build/test-results/testDebugUnitTest split-artifact/ha-unit-tests
      - uses: actions/upload-artifact@v4
        with:
          name: BOOP-Shield-v230-Wall-v207-Signed
          path: split-artifact/
          if-no-files-found: error
      - name: Remove temporary signer
        if: always()
        run: rm -f "${RUNNER_TEMP}/boop-dev.jks"
