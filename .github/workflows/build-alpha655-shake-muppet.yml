name: Build BOOP Alpha 6.5.5 Shake Muppet APK

on:
  push:
    branches: [ "alpha6.5.5-shake-muppet" ]
  workflow_dispatch:

concurrency:
  group: boop-alpha655-shake-muppet-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BOOP_KEYSTORE_BASE64: ${{ secrets.BOOP_KEYSTORE_BASE64 }}
      BOOP_KEYSTORE_PASSWORD: ${{ secrets.BOOP_KEYSTORE_PASSWORD }}
      BOOP_KEY_ALIAS: ${{ secrets.BOOP_KEY_ALIAS }}
      BOOP_KEY_PASSWORD: ${{ secrets.BOOP_KEY_PASSWORD }}

    steps:
      - name: Check out repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove physically-good Alpha 6.5.4 stayed frozen outside approved seams
        shell: bash
        run: |
          set -euo pipefail
          BASE=d960d00d9c9131453f7b37d3e6ca87af0bc2e478
          git diff --exit-code "$BASE" HEAD -- \
            source/ \
            ':(exclude)source/MainActivity.java' \
            ':(exclude)source/BoopFaceView.java' \
            ':(exclude)source/BoopShakeDetector.java' \
            ':(exclude)source/BoopShakeEyeMotion.java' \
            ':(exclude)source/app-build.gradle'
          git diff --exit-code "$BASE" HEAD -- \
            source/HomeAssistantClient.java \
            source/HomeAssistantDirectMediaClient.java \
            source/HomeAssistantMediaSelector.java \
            source/HomeAssistantGeneralAssistantClient.java \
            source/BoopCommandRouter.java \
            source/BoopConversationExitIntent.java \
            source/HomeAssistantLightColourClient.java \
            source/BoopWakeWordController.java \
            source/BoopSherpaWakeSpotter.java \
            source/BoopWakeSensitivity.java
          git diff --exit-code "$BASE" HEAD -- wake-assets/

      - name: Prove shake stays visual-only and routines stay absent
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n -E 'BoopTimedRoutineFlow|Once or recurring\?|Recurring routines need setup first' source/
          python3 - <<'PY'
          from pathlib import Path
          main = Path('source/MainActivity.java').read_text()
          start = main.index('private void handleShakeWake')
          end = main.index('\n    private ', start + 1)
          block = main[start:end]
          assert 'face.playShakeMuppet' in block
          assert 'startListening' not in block
          assert 'playWakeAcceptedCue' not in block
          assert 'ToneGenerator' not in block
          face = Path('source/BoopFaceView.java').read_text()
          assert 'drawRect(' not in face and 'drawRoundRect(' not in face
          PY

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bridge test dependencies
        run: python -m pip install 'aiohttp==3.14.3' 'wyoming==1.10.0'

      - name: Run bridge and source regression tests
        run: |
          python3 -m unittest bridge/test_boop_wyoming_bridge.py -v
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run shake detector and eye-motion harnesses
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/boop-shake-tests /tmp/boop-shake-motion-tests
          mkdir -p /tmp/boop-shake-tests /tmp/boop-shake-motion-tests
          javac -d /tmp/boop-shake-tests \
            source/BoopShakeDetector.java \
            tests/java/BoopShakeDetectorHarness.java
          java -cp /tmp/boop-shake-tests com.boop.alpha1.BoopShakeDetectorHarness
          javac -d /tmp/boop-shake-motion-tests \
            source/BoopShakeEyeMotion.java \
            tests/java/BoopShakeEyeMotionHarness.java
          java -cp /tmp/boop-shake-motion-tests com.boop.alpha1.BoopShakeEyeMotionHarness

      - name: Run conversation-exit behavior harness
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/boop-alpha655-exit-test
          mkdir -p /tmp/boop-alpha655-exit-test
          javac -d /tmp/boop-alpha655-exit-test \
            source/BoopConversationExitIntent.java \
            tests/java/BoopConversationExitIntentHarness.java
          java -cp /tmp/boop-alpha655-exit-test com.boop.alpha1.BoopConversationExitIntentHarness

      - name: Materialize editable BOOP project
        run: bash scripts/materialize-android.sh

      - name: Verify pinned wake runtime assets and shake sources materialized
        shell: bash
        run: |
          set -euo pipefail
          APP=boop-build/BOOP-Alpha1/app
          KWS="$APP/src/main/assets/boop-kws/keywords.txt"
          test -s "$APP/libs/sherpa-onnx-1.13.7.aar"
          test -s "$APP/src/main/assets/boop-kws/encoder-epoch-12-avg-2-chunk-16-left-64.int8.onnx"
          test -s "$APP/src/main/assets/boop-kws/decoder-epoch-12-avg-2-chunk-16-left-64.onnx"
          test -s "$APP/src/main/assets/boop-kws/joiner-epoch-12-avg-2-chunk-16-left-64.int8.onnx"
          test -s "$APP/src/main/assets/boop-kws/tokens.txt"
          test -s "$KWS"
          test "$(grep -c '@BOOP$' "$KWS")" -ge 33
          test -s "$APP/src/main/java/com/boop/alpha1/BoopShakeDetector.java"
          test -s "$APP/src/main/java/com/boop/alpha1/BoopShakeEyeMotion.java"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK and emulator
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "emulator" "system-images;android-36;google_apis;x86_64"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Run Android unit tests
        run: gradle -p boop-build/BOOP-Alpha1 :app:testDebugUnitTest --stacktrace

      - name: Prepare permanent BOOP signing key
        shell: bash
        run: |
          set -euo pipefail
          for name in BOOP_KEYSTORE_BASE64 BOOP_KEYSTORE_PASSWORD BOOP_KEY_ALIAS BOOP_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          BOOP_KEYSTORE_PATH="${RUNNER_TEMP}/boop-signing.jks"
          printf '%s' "$BOOP_KEYSTORE_BASE64" | base64 --decode > "$BOOP_KEYSTORE_PATH"
          chmod 600 "$BOOP_KEYSTORE_PATH"
          keytool -list -keystore "$BOOP_KEYSTORE_PATH" -storepass "$BOOP_KEYSTORE_PASSWORD" -alias "$BOOP_KEY_ALIAS" >/dev/null
          echo "BOOP_KEYSTORE_PATH=$BOOP_KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build BOOP Alpha 6.5.5 code28 APK
        run: gradle -p boop-build/BOOP-Alpha1 :app:assembleDebug --stacktrace

      - name: Inspect and verify Alpha 6.5.5 APK
        shell: bash
        run: |
          set -euo pipefail
          APK=boop-build/BOOP-Alpha1/app/build/outputs/apk/debug/app-debug.apk
          ${ANDROID_HOME}/build-tools/36.0.0/aapt dump badging "$APK" | tee badging.txt
          grep -q "versionCode='28'" badging.txt
          grep -q "versionName='0.4.9-alpha6.5.5'" badging.txt
          unzip -l "$APK" | grep -q 'assets/boop-kws/keywords.txt'
          unzip -l "$APK" | grep -q 'lib/.*/libsherpa-onnx-jni.so'
          ${ANDROID_HOME}/build-tools/36.0.0/apksigner verify --verbose "$APK"
          unzip -tq "$APK"

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Boot clean Android 16 Pixel 7 Pro emulator
        timeout-minutes: 6
        run: |
          export ANDROID_AVD_HOME="${RUNNER_TEMP}/android-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n boop-test -k "system-images;android-36;google_apis;x86_64" --device "pixel_7_pro"
          nohup "${ANDROID_HOME}/emulator/emulator" -avd boop-test -no-window -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data > emulator.log 2>&1 &
          if ! timeout 300s bash -c 'adb wait-for-device && until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 2; done'; then
            tail -n 160 emulator.log || true
            exit 1
          fi
          adb shell input keyevent 82 || true

      - name: Launch BOOP with wake microphone armed and verify process survives
        run: |
          APK=boop-build/BOOP-Alpha1/app/build/outputs/apk/debug/app-debug.apk
          adb install -r "$APK"
          adb shell pm grant com.boop.alpha1 android.permission.RECORD_AUDIO
          adb logcat -c
          adb shell am start -W -n com.boop.alpha1/.MainActivity
          sleep 8
          if ! adb shell pidof com.boop.alpha1 >/dev/null 2>&1; then
            adb logcat -d -v threadtime | grep -i -E 'boop|FATAL EXCEPTION|AndroidRuntime|Process: com\.boop\.alpha1|Caused by:|sensor|onnx|sherpa' || true
            exit 1
          fi

      - name: Upload BOOP Alpha 6.5.5 Shake Muppet APK
        uses: actions/upload-artifact@v4
        with:
          name: BOOP-Alpha6.5.5-Shake-Muppet-debug
          path: boop-build/BOOP-Alpha1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
