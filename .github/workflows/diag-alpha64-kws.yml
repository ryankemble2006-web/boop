name: Diagnose BOOP Alpha 6.4 KWS

on:
  push:
    branches: [ "alpha6.4-wake-word" ]
    paths:
      - '.github/workflows/diag-alpha64-kws.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install sherpa diagnostic runtime
        run: |
          python -m pip install 'sherpa-onnx==1.13.7' numpy soundfile click sentencepiece pypinyin
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg

      - name: Download exact GigaSpeech KWS model families
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://github.com/k2-fsa/sherpa-onnx/releases/download/kws-models'
          curl -fL --retry 3 -o model.tar.bz2 "$BASE/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01.tar.bz2"
          tar -xjf model.tar.bz2
          mv sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01 model
          curl -fL --retry 3 -o model-mobile.tar.bz2 "$BASE/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01-mobile.tar.bz2"
          tar -xjf model-mobile.tar.bz2
          mv sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01-mobile model-mobile
          echo '=== normal top-level files ==='
          find model -maxdepth 1 -type f -printf '%f\n' | sort
          echo '=== mobile top-level files ==='
          find model-mobile -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Regenerate BOOP keyword with sherpa text2token
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'BOOP :1.5 #0.25 @BOOP' > boop-raw.txt
          sherpa-onnx-cli text2token \
            --tokens model/tokens.txt \
            --tokens-type bpe \
            --bpe-model model/bpe.model \
            boop-raw.txt boop-generated.txt
          diff -u wake-assets/boop-kws/keywords.txt boop-generated.txt
          cp boop-generated.txt model/keywords.txt
          cp boop-generated.txt model-mobile/keywords.txt

      - name: Generate 16 kHz spoken BOOP samples
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p samples
          for speed in 115 140 165 190; do
            espeak-ng -v en-gb -s "$speed" -w "samples/raw-${speed}.wav" 'boop'
            ffmpeg -loglevel error -y -i "samples/raw-${speed}.wav" -ar 16000 -ac 1 -sample_fmt s16 "samples/boop-${speed}.wav"
          done

      - name: Compare mobile and normal KWS decode paths
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import wave
          import numpy as np
          import sherpa_onnx

          samples = []
          for speed in (115, 140, 165, 190):
              path = f'samples/boop-{speed}.wav'
              with wave.open(path, 'rb') as w:
                  assert w.getframerate() == 16000
                  assert w.getnchannels() == 1
                  assert w.getsampwidth() == 2
                  pcm = np.frombuffer(w.readframes(w.getnframes()), dtype='<i2').astype(np.float32) / 32768.0
              pcm = np.concatenate([pcm, np.zeros(12800, dtype=np.float32)])
              samples.append((path, pcm))

          def choose(root, stem):
              import os
              candidates = [
                  f'{root}/{stem}-epoch-12-avg-2-chunk-16-left-64.int8.onnx',
                  f'{root}/{stem}-epoch-12-avg-2-chunk-16-left-64.onnx',
              ]
              for p in candidates:
                  if os.path.isfile(p):
                      return p
              raise FileNotFoundError(candidates)

          def run(label, root):
              paths = {
                  'encoder': choose(root, 'encoder'),
                  'decoder': choose(root, 'decoder'),
                  'joiner': choose(root, 'joiner'),
              }
              print(f'=== {label}: {paths} ===', flush=True)
              kws = sherpa_onnx.KeywordSpotter(
                  tokens=f'{root}/tokens.txt',
                  encoder=paths['encoder'],
                  decoder=paths['decoder'],
                  joiner=paths['joiner'],
                  num_threads=2,
                  max_active_paths=4,
                  keywords_file=f'{root}/keywords.txt',
                  keywords_score=1.5,
                  keywords_threshold=0.25,
                  num_trailing_blanks=2,
                  provider='cpu',
              )
              detected = 0
              for path, pcm in samples:
                  stream = kws.create_stream()
                  result = ''
                  decode_calls = 0
                  try:
                      for i in range(0, len(pcm), 1600):
                          stream.accept_waveform(16000, pcm[i:i+1600])
                          while kws.is_ready(stream):
                              kws.decode_stream(stream)
                              decode_calls += 1
                              result = kws.get_result(stream)
                              if result:
                                  kws.reset_stream(stream)
                                  break
                          if result:
                              break
                      print(f'{label} {path}: result={result!r}, decode_calls={decode_calls}', flush=True)
                      if result:
                          detected += 1
                  except Exception as e:
                      print(f'{label} {path}: ERROR after {decode_calls} decodes: {type(e).__name__}: {e}', flush=True)
                      return False, detected
              return True, detected

          mobile_ok, mobile_detected = run('MOBILE', 'model-mobile')
          normal_ok, normal_detected = run('NORMAL', 'model')
          print(f'SUMMARY mobile_ok={mobile_ok} mobile_detected={mobile_detected}/4 normal_ok={normal_ok} normal_detected={normal_detected}/4', flush=True)

          if mobile_ok:
              raise SystemExit('Expected diagnostic mobile model to reproduce the decode failure, but it did not')
          if not normal_ok:
              raise SystemExit('Normal model also fails decode; mobile archive is not isolated as root cause')
          PY
