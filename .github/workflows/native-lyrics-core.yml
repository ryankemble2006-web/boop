name: Native lyrics functional checks
on:
  push:
    branches: ["boop-unified-native-lyrics-v157"]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lyrics-core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and exercise timed data, request ownership and transport
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/native-lyrics-core
          curl --fail --silent --show-error --location --max-time 30 https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o work/native-lyrics-core/json.jar
          echo '3cf6cd6892e32e2b4c1c39e0f52f5248a2f5b37646fdfbb79a66b46b618414ed  work/native-lyrics-core/json.jar' | sha256sum -c -
          src=unified/shield-home/src/main/java/com/boop/shieldhome
          files=()
          for name in DeezerLyricsDocument LyricsRequestGate DeezerLyricsClient DeezerLyricsHttp DeezerTimedLyricsClient; do
            if [ -f "$src/$name.java" ]; then files+=("$src/$name.java"); fi
          done
          javac -encoding UTF-8 -cp work/native-lyrics-core/json.jar -d work/native-lyrics-core "${files[@]}" tests/canonical/NativeLyricsCoreCheck.java tests/canonical/NativeLyricsTransportCheck.java tests/canonical/NativeLyricsIncompleteCheck.java
          java -cp work/native-lyrics-core:work/native-lyrics-core/json.jar com.boop.shieldhome.NativeLyricsCoreCheck
          java -cp work/native-lyrics-core:work/native-lyrics-core/json.jar com.boop.shieldhome.NativeLyricsTransportCheck
          java -cp work/native-lyrics-core:work/native-lyrics-core/json.jar com.boop.shieldhome.NativeLyricsIncompleteCheck
