name: Apply BOOP Alpha 6.5.2 Assistant Followup Patch

on:
  push:
    branches: [ "alpha6.5.2-assistant-followups" ]
    paths:
      - 'scripts/patch-alpha652-assistant-followups.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: alpha6.5.2-assistant-followups
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded follow-up patch
        run: python3 scripts/patch-alpha652-assistant-followups.py
      - name: Commit production patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name boop-ci
          git config user.email boop-ci@users.noreply.github.com
          git add source/MainActivity.java source/app-build.gradle
          if git diff --cached --quiet; then
            echo "Patch already applied."
            exit 0
          fi
          git commit -m "Add assistant-only five-second follow-up listening"
          git push origin HEAD:alpha6.5.2-assistant-followups
