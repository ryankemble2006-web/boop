name: Win7ify shell contracts
on:
  push:
    branches: [boop-win7ify-v01]
    paths: ['win7ify/**', '.github/workflows/win7ify-shell-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project win7ify/tests/Win7ify.ShellTests -c Release
