name: Build BOOP Unified APK

on:
  push:
    branches: [ "boop-unified", "boop-unified-notifications", "fix/v70-dev-menu-crash-scroll" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boop-unified-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out unified branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read expected unified version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          text = Path('unified/app-build.gradle').read_text(encoding='utf-8')
          code = re.search(r'^\s*versionCode\s+(\d+)\s*$', text, re.MULTILINE)
          name = re.search(r'^\s*versionName\s+["\']([^"\']+)["\']\s*$', text, re.MULTILINE)
          if not code or not name:
              raise SystemExit('Could not derive unified version from unified/app-build.gradle')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'BOOP_EXPECTED_VERSION_CODE={code.group(1)}\n')
              env.write(f'BOOP_EXPECTED_VERSION_NAME={name.group(1)}\n')
          print(f'Expected unified version: code={code.group(1)} name={name.group(1)}')
          PY

      - name: Check non-visual integration contracts
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_unified_docked_shield_pass.py tests/test_approved_eye_master_contract.py tests/test_unified_notification_asset_integrity.py tests/test_unified_notification_puppet_contract.py tests/test_unified_v70_dev_lab_contract.py
          python - <<'PY'
          from pathlib import Path
          heads = Path('unified/SOURCE_HEADS.md').read_text()
          for sha in ('a28364f98fba1b3a5dbab7e66075c0fb166e08e3',
                      '953ad6d5fe48df104a1f74bdcf4b448f5a6d04f2',
                      '1a487a4aaecd098d6854905ee64d60253ad6b4b7'):
              assert sha in heads
          print('Pinned source provenance retained. Visual acceptance is manual.')
          PY

      - name: Materialize one APK
        run: bash scripts/materialize-unified.sh

      - name: Test notification and developer-lab contracts
        run: |
          python -m pytest -q tests/test_unified_notification_manifest_contract.py tests/test_unified_v70_materialized_dev_menu_contract.py
          gradle --no-daemon -p boop-build/BOOP-Alpha1 :app:testDebugUnitTest \
            --tests '*BoopNotification*' --tests '*BoopDevMenuIntentTest' --stacktrace

      - name: Check seamless wake-command handoff
        run: python -m pytest -q tests/test_unified_wake_handoff_contract.py

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Cache wake assets
        uses: actions/cache@v4
        with:
          path: .cache/wake-assets
          key: boop-wake-${{ hashFiles('wake-assets.lock') }}

      - name: Fetch wake assets
        run: bash scripts/fetch-wake-assets.sh boop-build/BOOP-Alpha1/app

      - name: Download unified AndroidX dependencies
        run: |
          gradle --no-daemon -p boop-build/BOOP-Alpha1 \
            :app:dependencies \
            :app:compileDebugJavaWithJavac \
            :launcher-lib:compileDebugJavaWithJavac \
            :shield-lib:compileDebugJavaWithJavac \
            --stacktrace

      - name: Verify no undeclared network dependency
        run: |
          unset BOOP_RELAY_URL BOOP_RELAY_TOKEN
          gradle --offline --no-daemon -p boop-build/BOOP-Alpha1 \
            :app:compileDebugJavaWithJavac \
            :launcher-lib:compileDebugJavaWithJavac \
            :shield-lib:compileDebugJavaWithJavac \
            --stacktrace

      - name: Test Launcher preservation
        run: |
          gradle --no-daemon -p boop-build/BOOP-Alpha1 :launcher-lib:testDebugUnitTest --stacktrace

      - name: Lint Launcher preservation
        run: gradle --no-daemon -p boop-build/BOOP-Alpha1 :launcher-lib:lintDebug --stacktrace

      - name: Test Shield focused functional suite
        run: |
          gradle --no-daemon -p boop-build/BOOP-Alpha1 :shield-lib:testDebugUnitTest --stacktrace

      - name: Test Unified focused functional suite
        run: |
          unset BOOP_RELAY_URL BOOP_RELAY_TOKEN
          gradle --no-daemon -p boop-build/BOOP-Alpha1 :app:testDebugUnitTest \
            --tests '*BoopNotification*' --tests '*BoopDevMenuIntentTest' \
            --tests '*BoopWake*' --tests '*BoopSentencePiece*' --tests '*BoopCustomWake*' \
            --tests '*BoopDockPowerTest' --tests '*BoopMirrorIntentTest' \
            --tests '*BoopVoice*' --tests '*BoopCommandRouterTest' \
            --stacktrace

      - name: Prepare permanent BOOP signer
        shell: bash
        env:
          BOOP_SIGNING_KEYSTORE_B64: ${{ secrets.BOOP_SIGNING_KEYSTORE_B64 }}
          BOOP_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.BOOP_SIGNING_KEYSTORE_PASSWORD }}
          BOOP_SIGNING_KEY_ALIAS: ${{ secrets.BOOP_SIGNING_KEY_ALIAS }}
          BOOP_SIGNING_KEY_PASSWORD: ${{ secrets.BOOP_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${BOOP_SIGNING_KEYSTORE_B64:-}" ] || [ -z "${BOOP_SIGNING_KEYSTORE_PASSWORD:-}" ] || [ -z "${BOOP_SIGNING_KEY_ALIAS:-}" ] || [ -z "${BOOP_SIGNING_KEY_PASSWORD:-}" ]; then
            echo "Permanent BOOP signing secrets are required" >&2
            exit 1
          fi
          printf '%s' "$BOOP_SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/boop-release.jks"
          chmod 600 "$RUNNER_TEMP/boop-release.jks"
          {
            echo "BOOP_SIGNING_STORE_FILE=$RUNNER_TEMP/boop-release.jks"
            echo "BOOP_SIGNING_KEY_ALIAS=$BOOP_SIGNING_KEY_ALIAS"
            echo "BOOP_SIGNING_STORE_PASSWORD=$BOOP_SIGNING_KEYSTORE_PASSWORD"
            echo "BOOP_SIGNING_KEY_PASSWORD=$BOOP_SIGNING_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Assemble signed unified APK
        run: |
          unset BOOP_RELAY_URL BOOP_RELAY_TOKEN
          gradle --offline --no-daemon -p boop-build/BOOP-Alpha1 :app:assembleDebug --stacktrace

      - name: Verify package, signer, and archive
        shell: bash
        run: |
          set -euo pipefail
          APK=boop-build/BOOP-Alpha1/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOLS/aapt" dump badging "$APK" > badging.txt
          grep -Fq "package: name='com.boop.alpha1'" badging.txt
          grep -Fq "versionCode='${BOOP_EXPECTED_VERSION_CODE}'" badging.txt
          grep -Fq "versionName='${BOOP_EXPECTED_VERSION_NAME}'" badging.txt
          grep -Fq "launchable-activity: name='com.boop.alpha1.UnifiedEntryActivity'" badging.txt
          "$TOOLS/aapt" dump xmltree "$APK" AndroidManifest.xml > manifest-tree.txt
          for cls in com.boop.alpha1.MainActivity com.boop.alpha1.BoopDevMenuActivity com.boop.launcher.MainActivity com.boop.shieldoverlay.MainActivity com.boop.shieldoverlay.BoopOverlayService com.boop.shieldoverlay.DeezerMediaListenerService com.boop.alpha1.BoopVoiceInteractionService com.boop.alpha1.BoopVoiceInteractionSessionService; do
            grep -Fq "$cls" manifest-tree.txt
          done
          grep -Fq "android.intent.category.HOME" manifest-tree.txt
          grep -Fq "android.intent.category.LEANBACK_LAUNCHER" manifest-tree.txt
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" > signer.txt
          grep -Fq 'Verifies' signer.txt
          unzip -t "$APK"
          sha256sum "$APK" > apk-sha256.txt
          printf '%s\n' "$GITHUB_SHA" > built-commit.txt
          cp unified/SOURCE_HEADS.md source-heads.txt
          printf '%s\n' "package=com.boop.alpha1" "versionCode=${BOOP_EXPECTED_VERSION_CODE}" "versionName=${BOOP_EXPECTED_VERSION_NAME}" > verification.txt
          cat badging.txt >> verification.txt
          cat signer.txt >> verification.txt

      - name: Upload unified APK
        uses: actions/upload-artifact@v4
        with:
          name: BOOP-Unified
          path: |
            boop-build/BOOP-Alpha1/app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
            built-commit.txt
            signer.txt
            source-heads.txt
            verification.txt
          retention-days: 90
