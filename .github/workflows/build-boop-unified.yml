name: Build BOOP Unified APK

on:
  push:
    branches: [ "boop-unified" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boop-unified-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out unified branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check non-visual integration contracts
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_unified_docked_shield_pass.py tests/test_approved_eye_master_contract.py
          python - <<'PY'
          from pathlib import Path
          heads = Path('unified/SOURCE_HEADS.md').read_text()
          for sha in ('a28364f98fba1b3a5dbab7e66075c0fb166e08e3',
                      '953ad6d5fe48df104a1f74bdcf4b448f5a6d04f2',
                      '1a487a4aaecd098d6854905ee64d60253ad6b4b7'):
              assert sha in heads
          print('Pinned source provenance retained. Visual acceptance is manual.')
          PY

      - name: Materialize one APK
        run: bash scripts/materialize-unified.sh

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Install Android build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
          cache-read-only: false

      - name: Check preserved Launcher source
        run: gradle --no-daemon -p launcher lintDebug --stacktrace

      - name: Copy approved artwork without visual inspection
        shell: bash
        run: |
          set -euo pipefail
          ASSET="$(find boop-build/BOOP-Alpha1/app/src/main/res -type f -name 'boop_eyes.png' -print -quit)"
          test -n "$ASSET"
          mkdir -p shield-overlay/app/src/main/res/drawable-nodpi
          cp "$ASSET" shield-overlay/app/src/main/res/drawable-nodpi/boop_eyes.png

      - name: Test Shield control behaviour only
        run: |
          gradle --no-daemon -p shield-overlay :app:testDebugUnitTest \
            --tests '*Home*Test' --tests '*Room*Test' \
            --tests '*BinaryActionTest' --tests '*HaEntityCategoryTest' \
            --tests '*TvNavigationModelTest' --tests '*BoopPreferencesTest' \
            --tests '*DeezerPuppetSettingsModelTest' --tests '*DeezerAccessSettingsPlanTest' --stacktrace

      - name: Test wake names, routing, lifecycle and assistant policy only
        run: |
          unset BOOP_RELAY_URL BOOP_RELAY_TOKEN
          gradle --no-daemon -p boop-build/BOOP-Alpha1 :app:testDebugUnitTest \
            --tests '*BoopWake*' --tests '*BoopSentencePiece*' --tests '*BoopCustomWake*' \
            --tests '*BoopDockPowerTest' --tests '*BoopMirrorIntentTest' \
            --tests '*BoopVoice*' --tests '*BoopCommandRouterTest' \
            --tests '*BoopPcmRingBufferTest' --tests '*BoopDeviceProfileTest' \
            --tests '*ShieldEntryRouteTest' --tests '*BoopAssistant*' --stacktrace

      - name: Prepare permanent BOOP signer
        shell: bash
        env:
          BOOP_DEV_KEYSTORE_B64: ${{ secrets.BOOP_DEV_KEYSTORE_B64 }}
          BOOP_DEV_STORE_PASSWORD: ${{ secrets.BOOP_DEV_STORE_PASSWORD }}
          BOOP_DEV_KEY_PASSWORD: ${{ secrets.BOOP_DEV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in BOOP_DEV_KEYSTORE_B64 BOOP_DEV_STORE_PASSWORD BOOP_DEV_KEY_PASSWORD; do
            test -n "${!name:-}"
          done
          printf '%s' "$BOOP_DEV_KEYSTORE_B64" | base64 --decode > "${RUNNER_TEMP}/boop-dev.jks"
          chmod 600 "${RUNNER_TEMP}/boop-dev.jks"
          keytool -list -keystore "${RUNNER_TEMP}/boop-dev.jks" -storepass "$BOOP_DEV_STORE_PASSWORD" -alias boop-dev >/dev/null
          echo "BOOP_SIGNING_STORE_FILE=${RUNNER_TEMP}/boop-dev.jks" >> "$GITHUB_ENV"

      - name: Build signed unified APK
        env:
          BOOP_DEV_STORE_PASSWORD: ${{ secrets.BOOP_DEV_STORE_PASSWORD }}
          BOOP_DEV_KEY_PASSWORD: ${{ secrets.BOOP_DEV_KEY_PASSWORD }}
          BOOP_RELAY_URL: ${{ secrets.BOOP_RELAY_URL }}
          BOOP_RELAY_TOKEN: ${{ secrets.BOOP_RELAY_TOKEN }}
        run: gradle --no-daemon -p boop-build/BOOP-Alpha1 :app:assembleDebug --stacktrace

      - name: Verify package, permanent signer and archive
        shell: bash
        run: |
          set -euo pipefail
          APK=boop-build/BOOP-Alpha1/app/build/outputs/apk/debug/app-debug.apk
          TOOLS="${ANDROID_HOME}/build-tools/36.0.0"
          "$TOOLS/aapt" dump badging "$APK" > badging.txt
          grep -q "package: name='com.boop.alpha1'" badging.txt
          grep -q "versionCode='51'" badging.txt
          grep -q "versionName='1.2.5-unified-wake-command-normalize'" badging.txt
          grep -q "launchable-activity: name='com.boop.alpha1.UnifiedEntryActivity'" badging.txt
          "$TOOLS/aapt" dump xmltree "$APK" AndroidManifest.xml > manifest-tree.txt
          for cls in com.boop.alpha1.MainActivity com.boop.launcher.MainActivity com.boop.shieldoverlay.MainActivity com.boop.shieldoverlay.BoopOverlayService com.boop.shieldoverlay.DeezerMediaListenerService com.boop.alpha1.BoopVoiceInteractionService com.boop.alpha1.BoopVoiceInteractionSessionService; do
            grep -q "$cls" manifest-tree.txt
          done
          grep -q "android.intent.category.HOME" manifest-tree.txt
          "$TOOLS/apksigner" verify --print-certs "$APK" > signer.txt
          ACTUAL="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' signer.txt | tr -d '\r\n' | tr '[:upper:]' '[:lower:]')"
          EXPECTED="$(tr -d '\r\n' < shield-overlay/signing/boop-dev-cert-sha256.txt | tr '[:upper:]' '[:lower:]')"
          test -n "$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          printf '%s\n' "$ACTUAL" > signer-sha256.txt
          unzip -tq "$APK"
          sha256sum "$APK" | tee apk-sha256.txt
          git rev-parse HEAD | tee built-commit.txt
          cp unified/SOURCE_HEADS.md source-heads.txt
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          lines = ['Visual acceptance: MANUAL, not performed by GitHub.',
                   'Device/emulator launch: MANUAL, not performed by GitHub.',
                   'APK signature, package identity and ZIP integrity: verified.',
                   'Physical Shield / Pixel acceptance: pending.',
                   'Shield remote mic activation and remote-microphone audio: MANUAL, pending.']
          for label, root in [('Shield', Path('shield-overlay/app/build/test-results')),
                              ('Unified', Path('boop-build/BOOP-Alpha1/app/build/test-results'))]:
              totals = dict(tests=0, failures=0, errors=0, skipped=0)
              for path in root.rglob('TEST-*.xml'):
                  suite = ET.parse(path).getroot()
                  for key in totals:
                      totals[key] += int(suite.get(key, '0'))
              lines.append(label + ' focused functional tests: ' + str(totals))
          Path('verification.txt').write_text('\n'.join(lines) + '\n')
          print('\n'.join(lines))
          PY

      - name: Upload signed BOOP immediately
        uses: actions/upload-artifact@v4
        with:
          name: BOOP-Unified
          path: |
            boop-build/BOOP-Alpha1/app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
            built-commit.txt
            signer-sha256.txt
            source-heads.txt
            verification.txt
            badging.txt
          if-no-files-found: error

      # Ryan owns launch, appearance, animation and real-device acceptance.
      # No automated emulator installation, screenshots or visual tests run here.
      - name: Remove temporary signer
        if: always()
        run: rm -f "${RUNNER_TEMP}/boop-dev.jks"
