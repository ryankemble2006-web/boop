name: Apply BOOP Alpha 6.5.1 Source Patch

on:
  push:
    branches: [ "alpha6.5.1-manners-exit" ]

permissions:
  contents: write

concurrency:
  group: boop-alpha651-patch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bounded source patch
        run: python3 scripts/patch-alpha651-manners.py
      - name: Commit patch when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- source/MainActivity.java; then
            exit 0
          fi
          git config user.name "boop-ci"
          git config user.email "boop-ci@users.noreply.github.com"
          git add source/MainActivity.java
          git commit -m "Wire local conversation exit before house routing"
          git push origin HEAD:alpha6.5.1-manners-exit
