name: Build BOOP Wall Native Chat Eye Hue v37

on:
  push:
    branches: [ "boop-wall-native-chat-eye-hue" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boop-wall-native-chat-eye-hue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run focused source guards
        run: |
          python -m pip install pytest
          python -m pytest -q \
            tests/test_wall_native_chat_eye_hue.py \
            tests/test_member_berries.py \
            tests/test_alpha61_thinking_puppet.py \
            tests/test_alpha655_shake_muppet.py

      - name: Run hue and preserved Java harnesses
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/boop-hue /tmp/boop-chat /tmp/boop-shake /tmp/boop-shake-motion /tmp/boop-exit
          javac -d /tmp/boop-hue source/BoopEyeHueMath.java tests/java/BoopEyeHueMathHarness.java
          java -cp /tmp/boop-hue com.boop.alpha1.BoopEyeHueMathHarness
          javac -d /tmp/boop-chat source/CommandOutcome.java source/BoopChatMode.java source/BoopChatModeHold.java source/BoopCommandRouter.java tests/java/BoopChatModeHarness.java
          java -cp /tmp/boop-chat com.boop.alpha1.BoopChatModeHarness
          javac -d /tmp/boop-shake source/BoopShakeDetector.java tests/java/BoopShakeDetectorHarness.java
          java -cp /tmp/boop-shake com.boop.alpha1.BoopShakeDetectorHarness
          javac -d /tmp/boop-shake-motion source/BoopShakeEyeMotion.java tests/java/BoopShakeEyeMotionHarness.java
          java -cp /tmp/boop-shake-motion com.boop.alpha1.BoopShakeEyeMotionHarness
          javac -d /tmp/boop-exit source/BoopConversationExitIntent.java tests/java/BoopConversationExitIntentHarness.java
          java -cp /tmp/boop-exit com.boop.alpha1.BoopConversationExitIntentHarness
          javac -d /tmp/boop-hue source/BoopEyeHueVoiceIntent.java

      - name: Materialize native chat plus voice hue
        run: bash scripts/materialize-android.sh

      - name: Verify effective integration
        shell: bash
        run: |
          set -euo pipefail
          APP=boop-build/BOOP-Alpha1/app
          MAIN="$APP/src/main/java/com/boop/alpha1/MainActivity.java"
          FACE="$APP/src/main/java/com/boop/alpha1/BoopFaceView.java"
          grep -q 'BOOP_CHAT_MODE_V1' "$MAIN"
          grep -q 'BOOP_OPENAI_RELAY_V1' "$MAIN"
          grep -q 'eyeHueOverlay = new BoopEyeHueOverlay' "$MAIN"
          grep -q 'BoopEyeHueVoiceIntent.matches(transcript)' "$MAIN"
          grep -q 'showEyeHueControl();' "$MAIN"
          grep -q 'eyeHueOverlay.hide()' "$MAIN"
          ! grep -q 'eyeHueHoldRunnable' "$MAIN"
          ! grep -q 'BoopEyeHueOverlay.touchesBothEyes(face, event)' "$MAIN"
          ! grep -q 'BoopEyeHueSettings.addSlider' "$MAIN"
          grep -q 'setEyeHueDegrees(BoopEyeHue.loadHue(context));' "$FACE"
          grep -q 'paint.setColorFilter(BoopEyeHue.colorFilterForHue(hueDegrees));' "$FACE"
          grep -q 'BitmapFactory.decodeResource(getResources(), R.drawable.boop_eyes)' "$FACE"
          grep -q 'canvas.drawColor(Color.BLACK)' "$FACE"
          ! grep -qi 'mouth' "$FACE"
          test "$(grep -c '@BOOP$' "$APP/src/main/assets/boop-kws/keywords.txt")" -eq 33

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Run Android unit tests
        run: |
          unset BOOP_RELAY_URL BOOP_RELAY_TOKEN
          gradle -p boop-build/BOOP-Alpha1 :app:testDebugUnitTest --stacktrace

      - name: Prepare permanent BOOP signer
        shell: bash
        env:
          BOOP_DEV_KEYSTORE_B64: ${{ secrets.BOOP_DEV_KEYSTORE_B64 }}
          BOOP_DEV_STORE_PASSWORD: ${{ secrets.BOOP_DEV_STORE_PASSWORD }}
          BOOP_DEV_KEY_PASSWORD: ${{ secrets.BOOP_DEV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in BOOP_DEV_KEYSTORE_B64 BOOP_DEV_STORE_PASSWORD BOOP_DEV_KEY_PASSWORD; do
            test -n "${!name:-}"
          done
          printf '%s' "$BOOP_DEV_KEYSTORE_B64" | base64 --decode > "${RUNNER_TEMP}/boop-dev.jks"
          chmod 600 "${RUNNER_TEMP}/boop-dev.jks"
          keytool -list -keystore "${RUNNER_TEMP}/boop-dev.jks" -storepass "$BOOP_DEV_STORE_PASSWORD" -alias boop-dev >/dev/null
          echo "BOOP_SIGNING_STORE_FILE=${RUNNER_TEMP}/boop-dev.jks" >> "$GITHUB_ENV"

      - name: Build signed v37 with current Native Chat relay config
        env:
          BOOP_DEV_STORE_PASSWORD: ${{ secrets.BOOP_DEV_STORE_PASSWORD }}
          BOOP_DEV_KEY_PASSWORD: ${{ secrets.BOOP_DEV_KEY_PASSWORD }}
          BOOP_RELAY_URL: ${{ secrets.BOOP_RELAY_URL }}
          BOOP_RELAY_TOKEN: ${{ secrets.BOOP_RELAY_TOKEN }}
        run: gradle --no-daemon -p boop-build/BOOP-Alpha1 :app:assembleDebug --stacktrace

      - name: Verify install identity and signer continuity
        shell: bash
        run: |
          set -euo pipefail
          APK=boop-build/BOOP-Alpha1/app/build/outputs/apk/debug/app-debug.apk
          TOOLS="${ANDROID_HOME}/build-tools/36.0.0"
          "$TOOLS/aapt" dump badging "$APK" | tee badging.txt
          grep -q "package: name='com.boop.alpha1'" badging.txt
          grep -q "versionCode='37'" badging.txt
          grep -q "versionName='0.4.17-wall-eye-hue-voice'" badging.txt
          "$TOOLS/apksigner" verify --print-certs "$APK" | tee signer.txt
          ACTUAL="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' signer.txt | tr -d '\r\n' | tr '[:upper:]' '[:lower:]')"
          EXPECTED="$(tr -d '\r\n' < shield-overlay/signing/boop-dev-cert-sha256.txt | tr '[:upper:]' '[:lower:]')"
          test -n "$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          unzip -tq "$APK"
          sha256sum "$APK" | tee apk-sha256.txt
          git rev-parse HEAD | tee built-commit.txt

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: BOOP-Wall-Native-Chat-Eye-Hue-v37
          path: boop-build/BOOP-Alpha1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
