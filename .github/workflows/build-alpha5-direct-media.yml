name: Build BOOP Alpha 5 Direct Media APK

on:
  push:
    branches: [ "alpha5-direct-media" ]
  workflow_dispatch:

concurrency:
  group: boop-alpha5-direct-media-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BOOP_KEYSTORE_BASE64: ${{ secrets.BOOP_KEYSTORE_BASE64 }}
      BOOP_KEYSTORE_PASSWORD: ${{ secrets.BOOP_KEYSTORE_PASSWORD }}
      BOOP_KEY_ALIAS: ${{ secrets.BOOP_KEY_ALIAS }}
      BOOP_KEY_PASSWORD: ${{ secrets.BOOP_KEY_PASSWORD }}

    steps:
      - name: Check out repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove puppet surface stayed on happy-accident checkpoint
        run: git diff --exit-code 776e75cda3793aa43eeaa5ef80ec77d163ff0e44 HEAD -- source/MainActivity.java source/BoopFaceView.java

      - name: Run source regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Materialize editable BOOP project
        run: bash scripts/materialize-android.sh

      - name: Stamp Alpha 5 install-over version
        run: |
          sed -i 's/versionCode 6/versionCode 12/' boop-build/BOOP-Alpha1/app/build.gradle
          sed -i 's/versionName "0.3.3-alpha3"/versionName "0.4.0-alpha5"/' boop-build/BOOP-Alpha1/app/build.gradle
          grep -E 'versionCode|versionName' boop-build/BOOP-Alpha1/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK and emulator
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "emulator" "system-images;android-36;google_apis;x86_64"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Run Android unit tests
        run: gradle -p boop-build/BOOP-Alpha1 :app:testDebugUnitTest --stacktrace

      - name: Prepare permanent BOOP signing key
        shell: bash
        run: |
          set -euo pipefail
          for name in BOOP_KEYSTORE_BASE64 BOOP_KEYSTORE_PASSWORD BOOP_KEY_ALIAS BOOP_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          BOOP_KEYSTORE_PATH="${RUNNER_TEMP}/boop-signing.jks"
          printf '%s' "$BOOP_KEYSTORE_BASE64" | base64 --decode > "$BOOP_KEYSTORE_PATH"
          chmod 600 "$BOOP_KEYSTORE_PATH"
          keytool -list -keystore "$BOOP_KEYSTORE_PATH" -storepass "$BOOP_KEYSTORE_PASSWORD" -alias "$BOOP_KEY_ALIAS" >/dev/null
          echo "BOOP_KEYSTORE_PATH=$BOOP_KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build BOOP Alpha 5 APK
        run: gradle -p boop-build/BOOP-Alpha1 :app:assembleDebug --stacktrace

      - name: Inspect built APK
        run: |
          ${ANDROID_HOME}/build-tools/36.0.0/aapt dump badging boop-build/BOOP-Alpha1/app/build/outputs/apk/debug/app-debug.apk
          ${ANDROID_HOME}/build-tools/36.0.0/apksigner verify --verbose boop-build/BOOP-Alpha1/app/build/outputs/apk/debug/app-debug.apk

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Boot clean Android 16 emulator
        timeout-minutes: 6
        run: |
          export ANDROID_AVD_HOME="${RUNNER_TEMP}/android-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n boop-test -k "system-images;android-36;google_apis;x86_64" --device "pixel_7_pro"
          nohup "${ANDROID_HOME}/emulator/emulator" -avd boop-test -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data > emulator.log 2>&1 &
          if ! timeout 300s bash -c 'adb wait-for-device && until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 2; done'; then
            tail -n 160 emulator.log || true
            exit 1
          fi
          adb shell input keyevent 82 || true

      - name: Launch BOOP and verify process survives
        run: |
          APK=boop-build/BOOP-Alpha1/app/build/outputs/apk/debug/app-debug.apk
          adb install -r "$APK"
          adb logcat -c
          adb shell am start -W -n com.boop.alpha1/.MainActivity
          sleep 4
          if ! adb shell pidof com.boop.alpha1 >/dev/null 2>&1; then
            adb logcat -d -v threadtime | grep -i -E 'boop|FATAL EXCEPTION|AndroidRuntime|Process: com\.boop\.alpha1|Caused by:' || true
            exit 1
          fi

      - name: Upload BOOP Alpha 5 APK
        uses: actions/upload-artifact@v4
        with:
          name: BOOP-Alpha5-Direct-Media-debug
          path: boop-build/BOOP-Alpha1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
