name: Unified native lyrics integration checks
on:
  push:
    branches: ['boop-unified-native-lyrics-v162']
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Native routing and retained v161 source
        run: python3 tests/test_unified_native_lyrics.py
      - name: Timed lyrics and lifecycle logic
        run: bash scripts/test-unified-native-lyrics.sh
