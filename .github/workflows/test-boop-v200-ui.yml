name: Test BOOP TV chrome, voice surface and navigation
on:
  push:
    branches: [boop-hand-colour-v191]
    paths:
      - 'tests/test_v200_uniform_tv_chrome_voice_demo.py'
      - 'tests/test_voice_tv_focus_v202.py'
      - 'tests/test_natural_voice_latency_v203.py'
      - 'unified/UnifiedApplication.java'
      - 'unified/app-build.gradle'
      - 'unified/shield-home/src/main/java/com/boop/shieldhome/**'
      - 'source/BoopNaturalSpeechBackend.java'
      - 'source/BoopCanonicalFaceView.java'
      - 'scripts/patch-unified-v200-voice-ui.py'
      - '.github/workflows/build-boop-v191-hand-colour.yml'
      - '.github/workflows/test-boop-v200-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: boop-v200-ui-focused
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pytest
      - run: python -m pytest -q tests/test_v200_uniform_tv_chrome_voice_demo.py tests/test_voice_tv_focus_v202.py tests/test_natural_voice_latency_v203.py
