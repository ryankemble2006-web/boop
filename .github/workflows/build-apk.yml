name: Build BOOP Alpha 1 APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out BOOP
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 37 SDK
        run: yes | sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Publish BOOP Alpha 1 APK
        uses: actions/upload-artifact@v4
        with:
          name: BOOP-Alpha1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
