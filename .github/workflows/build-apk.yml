name: Build BOOP Alpha 2 APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master", "alpha2-local-ha-control", "alpha3-ha-device-identity", "alpha4-general-assistant" ]

concurrency:
  group: boop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BOOP_KEYSTORE_BASE64: ${{ secrets.BOOP_KEYSTORE_BASE64 }}
      BOOP_KEYSTORE_PASSWORD: ${{ secrets.BOOP_KEYSTORE_PASSWORD }}
      BOOP_KEY_ALIAS: ${{ secrets.BOOP_KEY_ALIAS }}
      BOOP_KEY_PASSWORD: ${{ secrets.BOOP_KEY_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run source regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Materialize editable BOOP project
        run: bash scripts/materialize-android.sh

      - name: Inspect launch-critical source
        run: |
          echo '=== PROJECT TREE ==='
          find boop-build/BOOP-Alpha1 -maxdepth 8 -type f | sort
          echo '=== APP BUILD.GRADLE ==='
          cat boop-build/BOOP-Alpha1/app/build.gradle
          echo '=== ANDROID MANIFEST ==='
          cat boop-build/BOOP-Alpha1/app/src/main/AndroidManifest.xml
          echo '=== JAVA SOURCES ==='
          find boop-build/BOOP-Alpha1/app/src/main -type f -name '*.java' -print -exec sh -c 'echo "--- $1 ---"; cat "$1"' _ {} \;
          echo '=== XML RESOURCES ==='
          find boop-build/BOOP-Alpha1/app/src/main/res -type f -name '*.xml' -print -exec sh -c 'echo "--- $1 ---"; cat "$1"' _ {} \;

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK and emulator
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "emulator" "system-images;android-36;google_apis;x86_64"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Run Android unit tests
        run: |
          set +e
          gradle -p boop-build/BOOP-Alpha1 :app:testDebugUnitTest --stacktrace 2>&1 | tee unit-test.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            grep -E 'error:|FAILED|FAILURE:|There were failing tests|AssertionError|expected:<|but was:<|Caused by:' unit-test.log | tail -n 200 > unit-test-summary.txt || true
            if [ ! -s unit-test-summary.txt ]; then tail -n 200 unit-test.log > unit-test-summary.txt; fi
          fi
          exit "$STATUS"

      - name: Upload unit-test failure summary
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BOOP-Alpha2-unit-test-failure
          path: unit-test-summary.txt
          if-no-files-found: ignore

      - name: Prepare permanent BOOP signing key
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in BOOP_KEYSTORE_BASE64 BOOP_KEYSTORE_PASSWORD BOOP_KEY_ALIAS BOOP_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Refusing to build a disposable-signed BOOP APK. Add the four BOOP signing secrets first."
            exit 1
          fi
          BOOP_KEYSTORE_PATH="${RUNNER_TEMP}/boop-signing.jks"
          printf '%s' "$BOOP_KEYSTORE_BASE64" | base64 --decode > "$BOOP_KEYSTORE_PATH"
          chmod 600 "$BOOP_KEYSTORE_PATH"
          keytool -list \
            -keystore "$BOOP_KEYSTORE_PATH" \
            -storepass "$BOOP_KEYSTORE_PASSWORD" \
            -alias "$BOOP_KEY_ALIAS" >/dev/null
          echo "BOOP_KEYSTORE_PATH=$BOOP_KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo 'Permanent BOOP signing key loaded.'

      - name: Build BOOP APK
        run: gradle -p boop-build/BOOP-Alpha1 :app:assembleDebug --stacktrace

      - name: Inspect built APK
        run: |
          echo '=== APK BADGING ==='
          ${ANDROID_HOME}/build-tools/36.0.0/aapt dump badging boop-build/BOOP-Alpha1/app/build/outputs/apk/debug/app-debug.apk

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || true

      - name: Boot clean Android 16 emulator
        timeout-minutes: 6
        run: |
          export ANDROID_AVD_HOME="${RUNNER_TEMP}/android-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n boop-test -k "system-images;android-36;google_apis;x86_64" --device "pixel_7_pro"
          echo '=== CREATED AVDS ==='
          "${ANDROID_HOME}/emulator/emulator" -list-avds || true
          echo '=== AVD FILES ==='
          find "$ANDROID_AVD_HOME" -maxdepth 3 -type f -print | sort || true
          nohup "${ANDROID_HOME}/emulator/emulator" -avd boop-test -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data > emulator.log 2>&1 &
          if ! timeout 300s bash -c 'adb wait-for-device && until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 2; done'; then
            echo '=== EMULATOR FAILED TO BOOT ==='
            tail -n 160 emulator.log || true
            adb devices -l || true
            exit 1
          fi
          adb shell input keyevent 82 || true
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

      - name: Launch BOOP and capture crash
        run: |
          APK=boop-build/BOOP-Alpha1/app/build/outputs/apk/debug/app-debug.apk
          adb install -r "$APK"
          adb logcat -c
          set +e
          adb shell am start -W -n com.boop.alpha1/.MainActivity
          START_STATUS=$?
          sleep 4
          echo '=== BOOP PROCESS ==='
          adb shell pidof com.boop.alpha1 || true
          echo '=== EXIT INFO ==='
          adb shell dumpsys activity exit-info com.boop.alpha1 || true
          echo '=== FATAL / ANDROIDRUNTIME LOG ==='
          adb logcat -d -v threadtime AndroidRuntime:E ActivityTaskManager:I ActivityManager:I '*:S' || true
          echo '=== BOOP-RELATED LOG ==='
          adb logcat -d -v threadtime | grep -i -E 'boop|FATAL EXCEPTION|AndroidRuntime|Process: com\.boop\.alpha1|Caused by:' || true
          echo '=== EMULATOR TAIL ==='
          tail -n 80 emulator.log || true
          if ! adb shell pidof com.boop.alpha1 >/dev/null 2>&1; then
            echo 'BOOP_DIED_AFTER_LAUNCH=1'
            exit 1
          fi
          exit $START_STATUS

      - name: Upload BOOP APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BOOP-Alpha2-debug
          path: boop-build/BOOP-Alpha1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error