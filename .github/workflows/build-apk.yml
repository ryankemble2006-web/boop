name: Build BOOP Alpha 1 APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack BOOP
        run: unzip -q BOOP-Alpha1-project.zip -d boop-build

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: yes | sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build BOOP APK
        run: gradle -p boop-build/BOOP-Alpha1 :app:assembleDebug --stacktrace

      - name: Upload BOOP APK
        uses: actions/upload-artifact@v4
        with:
          name: BOOP-Alpha1-debug
          path: boop-build/BOOP-Alpha1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
