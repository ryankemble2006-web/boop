name: Build BOOP Alpha 1 APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack BOOP
        run: unzip -q BOOP-Alpha1-project.zip -d boop-build

      - name: Inspect launch-critical source
        run: |
          echo '=== PROJECT TREE ==='
          find boop-build/BOOP-Alpha1 -maxdepth 5 -type f | sort
          echo '=== APP BUILD.GRADLE ==='
          cat boop-build/BOOP-Alpha1/app/build.gradle
          echo '=== ANDROID MANIFEST ==='
          cat boop-build/BOOP-Alpha1/app/src/main/AndroidManifest.xml
          echo '=== JAVA SOURCES ==='
          find boop-build/BOOP-Alpha1/app/src/main -type f -name '*.java' -print -exec sh -c 'echo "--- $1 ---"; cat "$1"' _ {} \;

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Make project use Android 36
        run: |
          sed -i 's/compileSdk 37/compileSdk 36/' boop-build/BOOP-Alpha1/app/build.gradle
          sed -i 's/targetSdk 37/targetSdk 36/' boop-build/BOOP-Alpha1/app/build.gradle

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build BOOP APK
        run: gradle -p boop-build/BOOP-Alpha1 :app:assembleDebug --stacktrace

      - name: Inspect built APK
        run: |
          echo '=== APK BADGING ==='
          ${ANDROID_HOME}/build-tools/36.0.0/aapt dump badging boop-build/BOOP-Alpha1/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload BOOP APK
        uses: actions/upload-artifact@v4
        with:
          name: BOOP-Alpha1-debug
          path: boop-build/BOOP-Alpha1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
