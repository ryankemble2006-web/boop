plugins { id 'com.android.application' }
android {
    namespace 'com.boop.lyricstest'
    compileSdk 36
    defaultConfig {
        // Emulator-only published identity exercises the real lab's provider filter.
        applicationId 'deezer.android.app'
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName 'BOOP-EMULATOR-ONLY-session-fixture'
    }
    signingConfigs { boopDev {
        storeFile file(System.getenv('BOOP_SIGNING_STORE_FILE'))
        storePassword System.getenv('BOOP_DEV_STORE_PASSWORD')
        keyAlias 'boop-dev'
        keyPassword System.getenv('BOOP_DEV_KEY_PASSWORD')
    } }
    buildTypes { debug { signingConfig signingConfigs.boopDev } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
