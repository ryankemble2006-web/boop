pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "BOOP-Alpha1"

include ':launcher-lib'
include ':shield-lib'

include ':shield-home-lib'

include ':animation-lib'

include ':assistant-lib', ':wall-app', ':shield-app'
dependencyResolutionManagement {
    repositories {
        maven {
            url = uri("$rootDir/local-maven")
            content { includeGroup 'com.boop.vendor' }
        }
    }
}
