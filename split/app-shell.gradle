// Both shells consume exactly the same permanent signing configuration.
def keyPath = System.getenv('BOOP_SIGNING_STORE_FILE')
def storeSecret = System.getenv('BOOP_DEV_STORE_PASSWORD')
def keySecret = System.getenv('BOOP_DEV_KEY_PASSWORD')
if (!keyPath || !storeSecret || !keySecret) {
    throw new GradleException('Existing permanent BOOP signing environment is required')
}
android {
    compileSdk 36
    defaultConfig { minSdk 29; targetSdk 36; versionCode 207 }
    signingConfigs {
        boopDev {
            storeFile file(keyPath)
            storePassword storeSecret
            keyAlias 'boop-dev'
            keyPassword keySecret
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
