plugins {
    id 'com.android.library'
}

android {
    namespace 'com.boop.launcher'
    compileSdk 36
    defaultConfig {
        minSdk 29
        targetSdk 36
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
