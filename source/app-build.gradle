plugins {
    id 'com.android.application'
}

def boopKeystorePath = System.getenv('BOOP_KEYSTORE_PATH')
def boopKeystorePassword = System.getenv('BOOP_KEYSTORE_PASSWORD')
def boopKeyAlias = System.getenv('BOOP_KEY_ALIAS')
def boopKeyPassword = System.getenv('BOOP_KEY_PASSWORD')

android {
    namespace 'com.boop.alpha1'
    compileSdk 36

    defaultConfig {
        applicationId 'com.boop.alpha1'
        minSdk 29
        targetSdk 36
        versionCode 28
        versionName "0.4.9-alpha6.5.5"
    }

    signingConfigs {
        boop {
            if (boopKeystorePath) {
                storeFile file(boopKeystorePath)
                storePassword boopKeystorePassword
                keyAlias boopKeyAlias
                keyPassword boopKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.boop
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation files('libs/sherpa-onnx-1.13.7.aar')
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.7.20'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
