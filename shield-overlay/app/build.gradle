plugins {
    id 'com.android.application'
}

def boopStore = System.getenv('BOOP_SIGNING_STORE_FILE')
def boopStorePassword = System.getenv('BOOP_DEV_STORE_PASSWORD')
def boopKeyPassword = System.getenv('BOOP_DEV_KEY_PASSWORD')

android {
    namespace 'com.boop.shieldoverlay'
    compileSdk 36
    enableKotlin = false

    signingConfigs {
        boopDev {
            if (boopStore != null) {
                storeFile file(boopStore)
                storePassword boopStorePassword
                keyAlias 'boop-dev'
                keyPassword boopKeyPassword
            }
        }
    }

    defaultConfig {
        applicationId 'com.boop.shieldoverlay'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1-poc'
    }

    buildTypes {
        debug {
            if (boopStore != null) {
                signingConfig signingConfigs.boopDev
            }
        }
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:okhttp-tls:4.12.0'
    implementation 'com.google.zxing:core:3.5.3'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}
