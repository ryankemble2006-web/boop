plugins { id 'com.android.application' }
android {
 namespace 'com.boop.launcher'
 compileSdk 36
 defaultConfig { applicationId 'com.boop.launcher'; minSdk 29; targetSdk 36; versionCode 7; versionName '0.3.0' }
 signingConfigs { release { def p = System.getenv('BOOP_KEYSTORE_PATH'); if (p) { storeFile file(p); storePassword System.getenv('BOOP_KEYSTORE_PASSWORD'); keyAlias System.getenv('BOOP_KEY_ALIAS'); keyPassword System.getenv('BOOP_KEY_PASSWORD') } } }
 buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
