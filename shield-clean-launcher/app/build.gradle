plugins {
    id 'com.android.application'
}

def boopStore = System.getenv('BOOP_SIGNING_STORE_FILE')
def boopStorePassword = System.getenv('BOOP_DEV_STORE_PASSWORD')
def boopKeyPassword = System.getenv('BOOP_DEV_KEY_PASSWORD')
def skipManualVisualTests = System.getenv('BOOP_SKIP_MANUAL_VISUAL_TESTS') == '1'

android {
    namespace 'com.boop.shieldhome'
    compileSdk 36

    signingConfigs {
        boopDev {
            if (boopStore != null) {
                storeFile file(boopStore)
                storePassword boopStorePassword
                keyAlias 'boop-dev'
                keyPassword boopKeyPassword
            }
        }
    }

    defaultConfig {
        applicationId 'com.boop.shieldhome'
        minSdk 26
        targetSdk 36
        versionCode 17
        versionName '0.10.2-accessibility-media'
    }

    sourceSets {
        main.java.srcDirs += '../../unified/shield-home/src/main/java'
        test.java.srcDirs += '../../unified/shield-home/src/test/java'
        if (skipManualVisualTests) {
            // Ryan owns real-device appearance acceptance. Keep these source files as historical
            // checks, but do not compile/run them in the fast GitHub delivery lane.
            test.java.exclude 'com/boop/shieldhome/AppCardChromePolicyTest.java'
            test.java.exclude 'com/boop/shieldhome/ShieldLauncherViewsTest.java'
            test.java.exclude 'com/boop/shieldhome/NowPlayingPuppetIntegrationContractTest.java'
        }
    }

    buildTypes {
        debug {
            if (boopStore != null) {
                signingConfig signingConfigs.boopDev
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
